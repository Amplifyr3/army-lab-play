<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1e">
<title>Claims · grey-box</title>
<style>
:root{--gold:#e6b84a;--cy:#5ad2e1;--vi:#785ae1;--navy:#0b0f1e;--ink:#e9ecf6;--dim:#97a0c2;--warn:#ff7a5c}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#0b0f1e;color:var(--ink);overflow:hidden;touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{position:fixed;left:0;top:0;touch-action:none;display:block}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#hud{position:fixed;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:6px;padding:0 8px;
  pointer-events:none;font-size:15px;font-variant-numeric:tabular-nums}
#hud .clock{font-weight:700;font-size:17px;min-width:44px}
#hud .clock.surge{color:var(--warn)}
#hud .me{display:flex;align-items:center;gap:4px;color:var(--gold);font-weight:700;min-width:92px}
#hud .me small{color:var(--dim);font-weight:400;font-size:14px}
#hud .riv{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
#hud .riv .top{display:flex;align-items:center;gap:5px;font-size:14px;white-space:nowrap;overflow:hidden}
#hud .riv .sig{font-weight:800;width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;color:#0b0f1e;font-size:14px}
#hud .riv .bar{height:7px;border-radius:4px;background:#1b2340;overflow:hidden}
#hud .riv .bar>div{height:100%;width:100%;transition:width .2s}
#hud .riv.dead{opacity:.35}
#toast{position:fixed;left:50%;top:62px;transform:translateX(-50%);max-width:94vw;padding:8px 14px;border-radius:12px;
  background:#141b34ee;border:1px solid #2a3560;font-size:15px;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
#toast.warn{border-color:var(--warn);color:#ffd6cc}
#hint{position:fixed;left:0;right:0;bottom:112px;text-align:center;font-size:14px;color:var(--dim);pointer-events:none;padding:0 12px;text-shadow:0 1px 3px #000}
#dock{position:fixed;left:0;right:0;bottom:0;height:108px;display:flex;align-items:center;justify-content:center;gap:14px;
  padding:0 14px calc(env(safe-area-inset-bottom) + 6px)}
#dock button{height:76px;border-radius:20px;border:2px solid #2c3762;background:#121a33;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:16px}
#dock button span{font-weight:400;font-size:14px;color:var(--dim)}
#bHome{width:96px}
#bPlant{flex:1;max-width:220px;border-color:var(--gold)!important;color:var(--gold)}
#bPlant.off{opacity:.45;border-color:#2c3762!important}
#bPlant.arm{background:#3a2e10}
#radial{position:fixed;inset:0;pointer-events:none}
#radial button{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:2px solid var(--gold);
  background:#191f38f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;pointer-events:auto;
  font-size:14px;font-weight:700;color:var(--gold);box-shadow:0 4px 18px #000a}
#radial button small{font-weight:400;font-size:13px;color:#d9dcea;line-height:1.05}
#radial button svg{width:30px;height:30px}
#radial button.no{opacity:.4}
#radial .why{position:absolute;transform:translateX(-50%);font-size:14px;color:#ffd6cc;white-space:nowrap;text-shadow:0 1px 3px #000}
.card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px 16px 12px;
  background:#0b0f1ef4;overflow:hidden;gap:10px}
.card[hidden]{display:none}
.card h1{margin:4px 0 0;font-size:30px;letter-spacing:.18em;color:var(--gold)}
.card .lede{margin:0;font-size:15px;color:#cfd5ea;text-align:center;max-width:380px}
.rules{width:100%;max-width:400px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#d6dbee}
.rules div{display:flex;gap:8px;align-items:flex-start}
.rules svg{flex:0 0 22px;width:22px;height:22px;margin-top:-1px}
.seeds{display:flex;gap:6px;width:100%;max-width:400px}
.seeds button{flex:1;height:58px;border-radius:14px;border:2px solid #34407a;background:#141c38;font-size:20px;font-weight:800}
.seeds button.r{font-size:15px}
.seedlines{width:100%;max-width:400px;font-size:14px;color:#c4cbe3;display:flex;flex-direction:column;gap:5px}
.seedlines b{color:var(--gold)}
.seedlines .c{color:var(--cy)}.seedlines .v{color:#a58cff}
.try{width:100%;max-width:400px;border:1px dashed #3b4677;border-radius:12px;padding:8px 10px;font-size:14px;color:#d6dbee}
.try b{color:var(--gold)}
#end h2{margin:18px 0 0;font-size:34px;letter-spacing:.1em}
#end .cause{font-size:18px;text-align:center;max-width:380px;line-height:1.35}
#end .stats{display:flex;gap:14px;font-size:15px;color:var(--dim)}
#end .stats b{color:var(--ink)}
#end .log{width:100%;max-width:380px;font-size:14px;line-height:1.45;color:#d6dbee;background:#121931;border-radius:12px;padding:8px 12px}
#end .log .t{color:var(--dim);display:inline-block;min-width:38px;font-variant-numeric:tabular-nums}
#end .log .sys{color:var(--dim)}
#end .btns{display:flex;gap:10px;width:100%;max-width:380px;margin-top:auto}
#end .btns button{flex:1;height:62px;border-radius:16px;border:2px solid #34407a;background:#141c38;font-weight:700;font-size:16px}
#end .btns button.main{border-color:var(--gold);color:var(--gold)}
#start{overflow-y:auto;touch-action:pan-y}
@media (max-height:760px){
  .card{gap:6px;padding-top:8px}.card h1{font-size:24px;margin:0}.card .lede{display:none}
  .rules{gap:3px}.seeds button{height:52px}.try{padding:6px 10px}.seedlines{gap:3px}
  #dock{height:80px}#dock button{height:60px}#hint{bottom:82px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden>
  <div class="clock" id="clock">0:00</div>
  <div class="me"><svg width="14" height="14" viewBox="-1 -1 2 2"><path d="M0,-1 L.85,.8 L-.85,.8Z" fill="#e6b84a"/></svg><b id="army">0</b><small id="cap">/45</small></div>
  <div class="riv" id="riv1"><div class="top"><span class="sig" style="background:#5ad2e1">C</span><span class="nm"></span></div><div class="bar"><div style="background:#5ad2e1"></div></div></div>
  <div class="riv" id="riv2"><div class="top"><span class="sig" style="background:#785ae1">S</span><span class="nm"></span></div><div class="bar"><div style="background:#785ae1"></div></div></div>
</div>
<div id="toast"></div>
<div id="hint"></div>
<div id="dock" hidden>
  <button id="bHome">HOME<span>recall</span></button>
  <button id="bPlant">PLANT<span>15 sparks</span></button>
</div>
<div id="radial" hidden></div>
<div id="start" class="card">
  <h1>CLAIMS</h1>
  <p class="lede">Your swarm is stardust. Spend it to claim the sky and shape the board, or throw it at their Core.</p>
  <div class="rules" id="rules"></div>
  <div class="seeds" id="seedBtns"></div>
  <div class="seedlines" id="seedLines"></div>
  <div class="try" id="tryBox"></div>
</div>
<div id="end" class="card" hidden>
  <h2 id="endTitle">WON</h2>
  <div class="cause" id="endCause"></div>
  <div class="stats" id="endStats"></div>
  <div class="log" id="endLog"></div>
  <div class="btns"><button id="bAgain" class="main">Again</button><button id="bNext">Next seed</button><button id="bMenu">Home</button></div>
</div>
<script>
'use strict';
(() => {
// ---------------------------------------------------------------- constants & tuning
const W = 360, H = 660, CS = 15, GC = 24, GR = 44, NC = GC * GR, MAXS = 300, DT = 1 / 60;
const COL = ['#e6b84a', '#5ad2e1', '#785ae1'];
const RGB = [[230, 184, 74], [90, 210, 225], [120, 90, 225]];
const NAMES = ['You', 'Corsairs', 'Syndicate'];
const POSS = ['your', "the Corsairs'", "the Syndicate's"];
const SIG = ['', 'C', 'S'];
const POST_COST = 15, MAX_POSTS = 4, BUILD_T = 3;
const T = {
  speed: 40, shipHp: 6, forgeMul: 1.5, shipRange: 22, shipCd: 0.6, shipDmg: 1, structDmg: 0.6,
  coreHp: [120, 100, 100], coreR: 18, turretHp: 20, turretRange: 55, turretCd: 0.6, turretDmg: 2, turretDist: 28,
  prodEvery: 1.0, beaconRate: 0.25, capBase: 45, capPerBeacon: 6, capPerCore: 20,
  coreRing: 60, beaconRing: 66, captureReach: 16,
  bastionHp: 400, bastionRange: 62, bastionCd: 0.45, bastionDmg: 2, bastionShots: 3,
  forgeHp: 60, forgeR: 34, beaconHp: 60, postR: 12,
  trail: 8, surgeAt: 300, surgeMul: 3, bleedBase: 0.5, bleedK: 2.0,
};
const KIND_NAME = { bastion: 'Bastion', forge: 'Forge', beacon: 'Beacon' };
const STYLE = {
  bastion: { name: 'Bastion crew', verb: 'walls the choke' },
  forge: { name: 'Forge crew', verb: 'hits hard down one lane' },
  beacon: { name: 'Beacon crew', verb: 'out-grows you' },
};

// ---------------------------------------------------------------- maps (variety engine)
const TEMPLATES = [
  { voids: [[70, 320, 78], [230, 330, 48]], chokes: [[165, 326]], well: [60, 468], rivals: [[80, 118], [282, 108]],
    desc: 'one narrow choke in the centre, an open right flank, the Starwell on your left' },
  { voids: [[-12, 300, 96], [372, 365, 96]], chokes: [], well: [180, 330], rivals: [[92, 140], [268, 96]],
    desc: 'no choke: a wide open middle with the Starwell in it' },
  { voids: [[205, 320, 55], [372, 325, 80]], chokes: [[276, 322]], well: [66, 330], rivals: [[105, 100], [292, 150]],
    desc: 'one narrow choke on the right, the Starwell out on the open left' },
  { voids: [[16, 330, 70], [180, 330, 60], [344, 330, 70]], chokes: [[103, 330], [257, 330]], well: [180, 196], rivals: [[66, 110], [294, 118]],
    desc: 'a wall with two chokes, the Starwell beyond it between the rivals' },
  { voids: [[180, 330, 94]], chokes: [], well: [180, 92], rivals: [[78, 176], [286, 118]],
    desc: 'a huge void in the centre, two long open flanks, the Starwell up top' },
];
const SEED_STYLES = { 1: ['bastion', 'beacon'], 2: ['forge', 'bastion'], 3: ['beacon', 'forge'], 4: ['bastion', 'forge'], 5: ['forge', 'beacon'] };

function rng(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function makeMap(seed) {
  const R = rng(seed * 7919 + 3);
  let tpl, styles, mirror = false, jit = 0;
  if (seed >= 1 && seed <= 5) { tpl = TEMPLATES[seed - 1]; styles = SEED_STYLES[seed]; }
  else {
    tpl = TEMPLATES[(R() * 5) | 0]; mirror = R() < 0.5; jit = 14;
    const all = ['bastion', 'forge', 'beacon']; const a = (R() * 3) | 0; let b = (R() * 3) | 0; if (b === a) b = (a + 1) % 3;
    styles = [all[a], all[b]];
  }
  const mx = x => mirror ? W - x : x;
  const j = () => (R() - 0.5) * jit;
  let desc = tpl.desc;
  if (mirror) desc = desc.replace(/left/g, '\u0001').replace(/right/g, 'left').replace(/\u0001/g, 'right');
  return {
    voids: tpl.voids.map(([x, y, r]) => ({ x: mx(x), y, r })),
    chokes: tpl.chokes.map(([x, y]) => ({ x: mx(x), y })),
    well: { x: mx(tpl.well[0]), y: tpl.well[1] },
    rivals: tpl.rivals.map(([x, y]) => ({ x: mx(x) + j(), y: y + j() })),
    home: { x: 180, y: 590 }, styles, desc,
  };
}
function seedLine(seed) {
  const m = makeMap(seed);
  return `${m.desc.charAt(0).toUpperCase() + m.desc.slice(1)}. Corsairs: ${STYLE[m.styles[0]].name} (${STYLE[m.styles[0]].verb}). Syndicate: ${STYLE[m.styles[1]].name} (${STYLE[m.styles[1]].verb}).`;
}

// ---------------------------------------------------------------- geometry helpers
const d2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const dist = (a, b) => Math.sqrt(d2(a.x, a.y, b.x, b.y));
const cellOf = (x, y) => { let i = (x / CS) | 0, j = (y / CS) | 0; if (i < 0) i = 0; if (i >= GC) i = GC - 1; if (j < 0) j = 0; if (j >= GR) j = GR - 1; return j * GC + i; };
const fmt = t => { t = Math.max(0, t | 0); return `${(t / 60) | 0}:${String(t % 60).padStart(2, '0')}`; };
function segHitsVoid(ax, ay, bx, by, pad) {
  const vs = G.map.voids;
  for (let k = 0; k < vs.length; k++) {
    const v = vs[k], dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy || 1;
    let u = ((v.x - ax) * dx + (v.y - ay) * dy) / L; u = u < 0 ? 0 : u > 1 ? 1 : u;
    const px = ax + dx * u - v.x, py = ay + dy * u - v.y, rr = v.r + pad;
    if (px * px + py * py < rr * rr) return true;
  }
  return false;
}
function inVoid(x, y, pad) { for (const v of G.map.voids) if (d2(x, y, v.x, v.y) < (v.r + pad) ** 2) return true; return false; }

// ---------------------------------------------------------------- state
let G = null;
const terrCv = document.createElement('canvas'); terrCv.width = GC; terrCv.height = GR;
const terrCx = terrCv.getContext('2d'); const terrImg = terrCx.createImageData(GC, GR);
const mineCv = document.createElement('canvas'); mineCv.width = GC; mineCv.height = GR;
const mineCx = mineCv.getContext('2d'); const mineImg = mineCx.createImageData(GC, GR);

function newGame(seed) {
  const map = makeMap(seed);
  const g = {
    seed, map, R: rng(seed * 9973 + 17), t: 0, over: false, endAt: 0, result: null,
    ships: [], free: [], structs: [], crews: [], fx: [], shots: [], log: [], taps: 0, actions: 0,
    ringOwner: new Int8Array(NC), ringDist: new Float32Array(NC), trailOwner: new Int8Array(NC).fill(-1), trailT: new Float32Array(NC),
    owner: new Int8Array(NC).fill(-1), blocked: new Uint8Array(NC), head: new Int16Array(NC), next: new Int16Array(MAXS),
    terrT: 0, flow: new Map(), surge: false, kills: [], banner: 4.5, share: [0.33, 0.33, 0.33],
  };
  G = g;
  for (let i = 0; i < MAXS; i++) { g.ships.push({ i, alive: false }); g.free.push(MAXS - 1 - i); }
  for (let j = 0; j < GR; j++) for (let i = 0; i < GC; i++) {
    const x = (i + 0.5) * CS, y = (j + 0.5) * CS;
    g.blocked[j * GC + i] = inVoid(x, y, 4) || x < 6 || x > W - 6 || y < 6 || y > H - 6 ? 1 : 0;
  }
  const pos = [map.home, map.rivals[0], map.rivals[1]];
  for (let c = 0; c < 3; c++) {
    const core = addStruct('core', c, pos[c].x, pos[c].y);
    for (let k = 0; k < 3; k++) {
      const a = (c === 0 ? -Math.PI / 2 : Math.PI / 2) + k * Math.PI * 2 / 3;
      const tu = addStruct('turret', c, pos[c].x + Math.cos(a) * T.turretDist, pos[c].y + Math.sin(a) * T.turretDist);
      tu.core = core; core.turrets.push(tu);
    }
    g.crews.push({
      id: c, alive: true, home: core, cores: [core], count: 0, cap: T.capBase, prodAcc: 0,
      order: { kind: 'home', x: core.x, y: core.y, ref: null, site: null, via: null },
      bot: c === 0 ? null : { style: map.styles[c - 1], next: 5 + g.R() * 3, wind: null, stage: 0, waitMove: null, atkStart: 0, threatT: 0, walkT: 0 },
      stats: { made: 0, lost: 0, built: { bastion: 0, forge: 0, beacon: 0 }, bastionKills: 0, lostToBastion: [0, 0, 0], coreDmg: [0, 0, 0], forgedCoreDmg: [0, 0, 0] },
    });
  }
  for (let c = 0; c < 3; c++) for (let k = 0; k < 8; k++) spawn(c, pos[c].x, pos[c].y, 0);
  recomputeTerritory();
  return g;
}
function addStruct(kind, crew, x, y, extra) {
  const hp = kind === 'core' ? T.coreHp[crew] : kind === 'turret' ? T.turretHp : kind === 'bastion' ? T.bastionHp : kind === 'forge' ? T.forgeHp : T.beaconHp;
  const s = { kind, crew, x, y, r: kind === 'core' ? T.coreR : kind === 'turret' ? 5 : T.postR, hp, maxhp: hp, alive: true, build: 0, cd: 0,
    turrets: [], core: null, kills: 0, well: false, aim: 0, hitT: 0, lastBy: -1 };
  if (extra) Object.assign(s, extra);
  G.structs.push(s);
  return s;
}
function spawn(c, x, y, state) {
  if (!G.free.length) return null;
  const s = G.ships[G.free.pop()], R = G.R;
  s.alive = true; s.crew = c; s.x = x + (R() - 0.5) * 8; s.y = y + (R() - 0.5) * 8; s.vx = 0; s.vy = 0;
  s.hp = s.maxhp = T.shipHp; s.forged = false; s.cd = R() * 0.5; s.state = state; s.slot = 0;
  s.ang = R() * Math.PI * 2; s.rr = 24 + R() * 18; s.navT = s.i % 6; s.dirx = 0; s.diry = 0; s.los = true; s.viaDone = false; s.tgt = null; s.flash = 0;
  G.crews[c].count++; G.crews[c].stats.made++;
  return s;
}
function killShip(s, by, spent) {
  if (!s.alive) return;
  s.alive = false; G.free.push(s.i); const cr = G.crews[s.crew]; cr.count--;
  if (spent) { addFx(s.x, s.y, s.crew, 1); return; }
  cr.stats.lost++;
  addFx(s.x, s.y, s.crew, 0);
  if (by && by.kind === 'bastion') { by.kills++; G.crews[by.crew].stats.bastionKills++; cr.stats.lostToBastion[by.crew]++; }
}
function addFx(x, y, c, kind) { if (G.fx.length > 140) G.fx.shift(); G.fx.push({ x, y, c, kind, t: 0 }); }
function addShot(x1, y1, x2, y2, c) { if (G.shots.length > 260) return; G.shots.push({ x1, y1, x2, y2, c, t: 0.14 }); }

// ---------------------------------------------------------------- flow fields (pathing round voids)
function flowTo(cell) {
  let f = G.flow.get(cell);
  if (f) return f;
  if (G.flow.size > 80) G.flow.clear();
  f = new Float32Array(NC).fill(1e9);
  let start = cell;
  if (G.blocked[start]) { // nearest open cell
    let best = 1e9; const ci = cell % GC, cj = (cell / GC) | 0;
    for (let k = 0; k < NC; k++) if (!G.blocked[k]) { const dd = (k % GC - ci) ** 2 + (((k / GC) | 0) - cj) ** 2; if (dd < best) { best = dd; start = k; } }
  }
  const q = new Int16Array(NC * 2); let qh = 0, qt = 0; f[start] = 0; q[qt++] = start;
  while (qh < qt) {
    const k = q[qh++], i = k % GC, j = (k / GC) | 0, base = f[k];
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      if (!di && !dj) continue;
      const ni = i + di, nj = j + dj; if (ni < 0 || nj < 0 || ni >= GC || nj >= GR) continue;
      const n = nj * GC + ni; if (G.blocked[n]) continue;
      if (di && dj && (G.blocked[j * GC + ni] || G.blocked[nj * GC + i])) continue;
      const nd = base + (di && dj ? 1.414 : 1);
      if (nd < f[n]) { f[n] = nd; if (qt < q.length) q[qt++] = n; }
    }
  }
  G.flow.set(cell, f);
  return f;
}
function pathLen(a, b) { const f = flowTo(cellOf(b.x, b.y)); return f[cellOf(a.x, a.y)] * CS; }
function navigate(s, gx, gy) {
  if (!segHitsVoid(s.x, s.y, gx, gy, 5)) { s.los = true; return; }
  s.los = false;
  const f = flowTo(cellOf(gx, gy)), k = cellOf(s.x, s.y), i = k % GC, j = (k / GC) | 0;
  let best = f[k], bx = s.x, by = s.y;
  for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
    const ni = i + di, nj = j + dj; if (ni < 0 || nj < 0 || ni >= GC || nj >= GR) continue;
    const n = nj * GC + ni; if (f[n] < best) { best = f[n]; bx = (ni + 0.5) * CS; by = (nj + 0.5) * CS; }
  }
  const dx = bx - s.x, dy = by - s.y, l = Math.hypot(dx, dy) || 1;
  s.dirx = dx / l; s.diry = dy / l;
}

// ---------------------------------------------------------------- territory: Core rings + Beacon rings + thin trails
function recomputeTerritory() {
  const g = G; g.ringOwner.fill(-1); g.ringDist.fill(1e9);
  const src = (x, y, r, c) => {
    const i0 = Math.max(0, ((x - r) / CS) | 0), i1 = Math.min(GC - 1, ((x + r) / CS) | 0);

      ctx.setTransform(dpr * SC * co, dpr * SC * si, -dpr * SC * si, dpr * SC * co, dpr * (BX + s.x * SC), dpr * (BY + s.y * SC));
      ctx.fill(SHIPP[c]);
      if (s.forged) { ctx.strokeStyle = s.flash > 0 ? '#fff' : '#ffffffaa'; ctx.lineWidth = 0.9; ctx.stroke(SHIPP[c]); }
    }
  }
  ctx.setTransform(dpr * SC, 0, 0, dpr * SC, dpr * BX, dpr * BY);
  // shots
  ctx.lineWidth = 1;
  for (let c = 0; c < 3; c++) { ctx.strokeStyle = COL[c]; ctx.beginPath(); for (const s of g.shots) if (s.c === c) { ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); } ctx.stroke(); }
  // fx
  for (const f of g.fx) {
    const big = f.kind >= 2, life = big ? 1.2 : 0.4; if (f.t > life) continue; const u = f.t / life;
    ctx.strokeStyle = f.kind === 1 ? '#fff6d0' : COL[f.c]; ctx.globalAlpha = 1 - u; ctx.lineWidth = big ? 3 : 1;
    ctx.beginPath(); ctx.arc(f.x, f.y, big ? 10 + 50 * u : f.kind === 1 ? 6 * (1 - u) : 2 + 7 * u, 0, 7); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // bot telegraphs: growing ring at the Core + dotted line to the target
  for (let c = 1; c < 3; c++) {
    const cr = g.crews[c], w = cr.bot && cr.bot.wind; if (!w || !cr.alive) continue;
    const u = 1 - w.t / 3, h = cr.home;
    ctx.strokeStyle = COL[c]; ctx.lineWidth = 2.5; ctx.globalAlpha = 0.5 + 0.5 * u;
    ctx.beginPath(); ctx.arc(h.x, h.y, 22 + 34 * u, 0, 7); ctx.stroke();
    ctx.setLineDash([3, 5]); ctx.lineDashOffset = -now * 30; ctx.lineWidth = w.ref && w.ref.crew === 0 ? 3 : 1.8;
    ctx.beginPath(); ctx.moveTo(h.x, h.y); if (w.via) ctx.lineTo(w.via.x, w.via.y); ctx.lineTo(w.x, w.y); ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset = 0;
    ctx.save(); ctx.translate(w.x, w.y);
    if (w.kind === 'attack') { ctx.beginPath(); ctx.arc(0, 0, 14, 0, 7); ctx.moveTo(-20, 0); ctx.lineTo(20, 0); ctx.moveTo(0, -20); ctx.lineTo(0, 20); ctx.stroke(); }
    else { ctx.scale(11, 11); ctx.lineWidth = 0.15; ctx.stroke(HEX); if (w.post) ctx.stroke(ICONP[w.post]); }
    ctx.restore(); ctx.globalAlpha = 1;
    ctx.fillStyle = COL[c]; ctx.font = '700 14px system-ui';
    ctx.fillText(w.kind === 'attack' ? Math.ceil(w.t) + '' : w.kind === 'plant' ? KIND_NAME[w.post] : 'moving', h.x, h.y - 46);
  }
  // your order marker
  { const o = g.crews[0].order; if (g.crews[0].alive && (o.kind === 'move' || o.kind === 'attack')) {
    ctx.strokeStyle = '#e6b84acc'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.arc(o.ref ? o.ref.x : o.x, o.ref ? o.ref.y : o.y, o.kind === 'attack' ? 30 : 10, 0, 7); ctx.stroke(); ctx.setLineDash([]); } }
  // hold-to-plant progress ring
  if (press && !press.long && !press.moved) {
    const u = (performance.now() - press.t) / 350;
    if (u > 0.3) { const [wx, wy] = toWorld(press.x, press.y); ctx.strokeStyle = '#e6b84a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(wx, wy, 22, -Math.PI / 2, -Math.PI / 2 + Math.min(1, u) * Math.PI * 2); ctx.stroke(); }
  }
  // banners
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.textAlign = 'center';
  if (g.banner > 0 && !g.over) {
    ctx.globalAlpha = Math.min(1, g.banner);
    ctx.fillStyle = '#0b0f1ecc'; ctx.fillRect(0, VH * 0.42 - 34, VW, 68);
    ctx.fillStyle = '#e6b84a'; ctx.font = '700 17px system-ui'; ctx.fillText(`Seed ${g.seed}`, VW / 2, VH * 0.42 - 13);
    ctx.fillStyle = '#e9ecf6'; ctx.font = '15px system-ui'; wrapText(g.map.desc, VW / 2, VH * 0.42 + 10, VW - 30, 18);
    ctx.globalAlpha = 1;
  }
}
function wrapText(t, x, y, mw, lh) {
  const words = t.split(' '); let line = '', yy = y;
  for (const w of words) { const test = line ? line + ' ' + w : w; if (ctx.measureText(test).width > mw && line) { ctx.fillText(line, x, yy); line = w; yy += lh; } else line = test; }
  ctx.fillText(line, x, yy);
}
function drawStruct(s, now) {
  const col = COL[s.crew];
  if (s.kind === 'turret') {
    ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, 7); ctx.fillStyle = '#0b0f1e'; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(s.x, s.y, 2, 0, 7); ctx.fillStyle = col; ctx.fill(); return;
  }
  if (s.kind === 'core') {
    const c = G.crews[s.crew];
    if (s.crew === 0) { // crown ring with six points (circumscribed)
      ctx.strokeStyle = '#e6b84a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(s.x, s.y, T.turretDist, 0, 7); ctx.stroke();
      ctx.fillStyle = '#e6b84a'; for (let k = 0; k < 6; k++) { const a = -Math.PI / 2 + k * Math.PI / 3; ctx.beginPath(); ctx.arc(s.x + Math.cos(a) * T.turretDist, s.y + Math.sin(a) * T.turretDist, 1.8, 0, 7); ctx.fill(); }
    }
    ctx.save(); ctx.translate(s.x, s.y); ctx.scale(s.r, s.r);
    ctx.fillStyle = s.hitT > 0 ? '#ffffff' : '#141b36'; ctx.fill(HEX); ctx.lineWidth = 0.16; ctx.strokeStyle = col; ctx.stroke(HEX);
    ctx.restore();
    if (G.surge) { ctx.strokeStyle = '#ff7a5c'; ctx.globalAlpha = 0.4 + 0.4 * Math.sin(now * 8); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(s.x - 9, s.y - 12); ctx.lineTo(s.x - 2, s.y - 3); ctx.lineTo(s.x - 7, s.y + 4); ctx.lineTo(s.x + 3, s.y + 13); ctx.stroke(); ctx.globalAlpha = 1; }
    // hp arc
    ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(s.x, s.y, s.r + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0, s.hp / s.maxhp)); ctx.stroke();
    ctx.fillStyle = col; ctx.font = '800 15px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(s.crew === 0 ? '★' : SIG[s.crew], s.x, s.y + 1);
    if (s !== c.home) { ctx.font = '600 14px system-ui'; ctx.fillText('captured', s.x, s.y + 32); }
    return;
  }
  // posts: hex + silhouette icon
  const building = s.build > 0, u = building ? 1 - s.build / BUILD_T : 1;
  ctx.save(); ctx.translate(s.x, s.y); ctx.scale(s.r, s.r);
  ctx.fillStyle = s.hitT > 0 ? '#ffffff' : '#0b0f1e'; ctx.globalAlpha = building ? 0.6 : 1; ctx.fill(HEX); ctx.globalAlpha = 1;
  ctx.lineWidth = s.kind === 'bastion' ? 0.24 : 0.15; ctx.strokeStyle = col;
  if (building) { ctx.setLineDash([6 * u + 0.01, 7]); ctx.stroke(HEX); ctx.setLineDash([]); } else ctx.stroke(HEX);
  ctx.globalAlpha = building ? 0.35 + 0.65 * u : 1;
  if (s.kind === 'bastion') { ctx.save(); ctx.rotate(s.aim + Math.PI / 2); ctx.fillStyle = col; ctx.fill(ICONP.bastion); ctx.restore(); }
  else if (s.kind === 'forge') { ctx.fillStyle = col; ctx.fill(ICONP.forge); }
  else { ctx.fillStyle = col; ctx.fill(ICONP.beacon); ctx.strokeStyle = col; ctx.lineWidth = 0.1; ctx.beginPath(); ctx.moveTo(-0.66, 0); ctx.lineTo(-0.42, 0); ctx.moveTo(0.42, 0); ctx.lineTo(0.66, 0); ctx.moveTo(0, -0.72); ctx.lineTo(0, -0.62); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.restore();
  if (building) { ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(s.x, s.y, s.r + 7 + 3 * Math.sin(now * 10), -Math.PI / 2, -Math.PI / 2 + u * Math.PI * 2); ctx.stroke(); }
  if (s.well) { ctx.fillStyle = col; ctx.font = '700 14px system-ui'; ctx.textAlign = 'center'; ctx.fillText('×2', s.x + 17, s.y - 13); }
  if (s.hp < s.maxhp && !building) { ctx.fillStyle = '#000a'; ctx.fillRect(s.x - 12, s.y + 15, 24, 3.5); ctx.fillStyle = col; ctx.fillRect(s.x - 12, s.y + 15, 24 * s.hp / s.maxhp, 3.5); }
}

// ---------------------------------------------------------------- DOM: HUD, dock, toasts, radial, cards
const $ = id => document.getElementById(id);
let toastT = 0, toastPri = false;
function toast(msg, warn, crew) {
  if (!G || (G.fast && !G.fastToasts)) return;
  if (toastPri && toastT > 0.8 && !warn) return;
  const el = $('toast'); el.textContent = msg; el.className = 'on' + (warn ? ' warn' : '');
  el.style.color = crew ? COL[crew] : ''; toastT = 2.8; toastPri = !!warn;
}
let hudT = 0;
function updateHud(dt) {
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').className = ''; }
  hudT -= dt; if (hudT > 0 || !G) return; hudT = 0.2;
  const g = G, me = g.crews[0];
  const ck = $('clock'); ck.textContent = fmt(g.t); ck.className = 'clock' + (g.surge ? ' surge' : '');
  $('army').textContent = me.count; $('cap').textContent = g.surge ? ` ${Math.round(g.share[0] * 100)}% gnd` : '/' + me.cap;
  for (let c = 1; c < 3; c++) {
    const cr = g.crews[c], el = $('riv' + c), h = cr.home;
    el.className = 'riv' + (cr.alive ? '' : ' dead');
    const posts = g.structs.filter(p => p.alive && p.crew === c && p.kind !== 'core' && p.kind !== 'turret');
    el.querySelector('.nm').innerHTML = `${KIND_NAME[cr.bot.style]} <span style="color:#97a0c2">${g.surge ? Math.round(g.share[c] * 100) + '% gnd' : '▲' + cr.count}</span>`;
    el.querySelector('.bar>div').style.width = (cr.alive ? Math.max(0, h.hp / h.maxhp) * 100 : 0) + '%';
  }
  const bp = $('bPlant'), can = me.count >= POST_COST && postCount(0) < MAX_POSTS;
  bp.className = (can ? '' : 'off') + (plantArm ? ' arm' : '');
  bp.querySelector('span').textContent = postCount(0) >= MAX_POSTS ? '4 / 4 posts' : plantArm ? 'tap gold ground' : `15 sparks · ${postCount(0)}/4`;
  let hint = '';
  if (plantArm) hint = 'Tap glowing gold ground. PLANT again cancels.';
  else if (radial) hint = 'Pick a post. Tap elsewhere to cancel.';
  else if (g.t < 25 && postCount(0) === 0) hint = 'Tap = send the swarm. Hold where it flies = plant a post.';
  else if (me.count < POST_COST && postCount(0) < MAX_POSTS && g.t < 60) hint = `Saving sparks: ${me.count}/15 to plant.`;
  $('hint').textContent = hint;
}

function openRadial(wx, wy) {
  [wx, wy] = snapWell(wx, wy);
  const why = plantCheck(0, wx, wy);
  const msg = { void: "Can't plant in a void.", max: 'You already have 4 posts.', close: 'Too close to another post or Core.',
    ground: 'Not your ground. Send the swarm there first: its trail makes gold ground.',
    home: "Posts go up beyond your Core's ring. Send the swarm out, then hold where it flies.", ships: `Need 15 sparks (you have ${G.crews[0].count}).` }[why];
  if (why) { toast(msg, true); return false; }
  const [sx, sy] = toScreen(wx, wy); const onWell = d2(wx, wy, G.map.well.x, G.map.well.y) < 20 * 20;
  radial = { wx, wy };
  const el = $('radial'); el.hidden = false; el.innerHTML = '';
  // three big buttons in a shallow arc above the spot (below it near the top), the whole group kept on screen
  const up = sy > HUD_H + 150, gap = 92;
  const cx = Math.max(gap + 46, Math.min(VW - gap - 46, sx));
  const kinds = ['bastion', 'forge', 'beacon'];
  const sub = { bastion: 'walls a lane', forge: '+50% hp lane', beacon: onWell ? 'ground ×2' : 'ground +sparks' };
  kinds.forEach((k, i) => {
    const bx = cx + (i - 1) * gap;
    let by = up ? sy - 88 + (i === 1 ? -14 : 0) : sy + 88 + (i === 1 ? 14 : 0);
    by = Math.max(HUD_H + 46, Math.min(VH - DOCK_H - 30, by));
    const b = document.createElement('button'); b.style.left = bx + 'px'; b.style.top = by + 'px'; b.dataset.kind = k;
    b.innerHTML = svgIcon(k, '#e6b84a') + `<span>${KIND_NAME[k]}</span><small>${sub[k]}</small>`;
    b.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); G.taps++; choosePost(k); });
    el.appendChild(b);
  });
  return true;
}
function closeRadial() { radial = null; const el = $('radial'); el.hidden = true; el.innerHTML = ''; }
function choosePost(k) { if (!radial) return; const r = radial; closeRadial(); if (!playerOrder('plant', r.wx, r.wy, k)) toast('Could not plant there any more.', true); }

cv.addEventListener('pointerdown', e => {
  if (!G || G.over) return; e.preventDefault();
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), long: false, moved: false };
});
cv.addEventListener('pointermove', e => { if (press && e.pointerId === press.id && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 14) press.moved = true; });
cv.addEventListener('pointerup', e => {
  if (!press || e.pointerId !== press.id) return;
  const p = press; press = null;
  if (p.long || !G || G.over) return;
  if (Math.hypot(e.clientX - p.x, e.clientY - p.y) > 40) return;
  G.taps++;
  if (radial) { closeRadial(); return; }
  const [wx, wy] = toWorld(p.x, p.y);
  if (plantArm) { plantArm = false; openRadial(wx, wy); return; }
  playerOrder('tap', wx, wy);
});
cv.addEventListener('pointercancel', () => { press = null; });
function checkLongPress() {
  if (!press || press.long || press.moved || !G || G.over) return;
  if (performance.now() - press.t >= 350) { press.long = true; G.taps++; if (radial) closeRadial(); const [wx, wy] = toWorld(press.x, press.y); plantArm = false; openRadial(wx, wy); }
}
$('bHome').addEventListener('click', () => { if (!G || G.over) return; G.taps++; closeRadial(); plantArm = false; playerOrder('home'); });
$('bPlant').addEventListener('click', () => {
  if (!G || G.over) return; G.taps++; closeRadial();
  if (plantArm) { plantArm = false; return; }
  if (postCount(0) >= MAX_POSTS) { toast('You already have 4 posts.', true); return; }
  if (G.crews[0].count < POST_COST) { toast(`Need 15 sparks (you have ${G.crews[0].count}).`, true); return; }
  plantArm = true; hudT = 0;
});

// start card
const TRY = [
  '<b>1.</b> Plant a Beacon on the Starwell before anyone does (send the swarm there, then hold on it).',
  '<b>2.</b> Bastion the choke, then strike the other way.',
  '<b>3.</b> Play seeds 1 and 2 back to back: same rules, different board, different plan.',
];
function buildStart() {
  $('rules').innerHTML = [
    `<div><svg viewBox="-1 -1 2 2"><path d="M.9,0 L-.6,.56 L-.6,-.56Z" fill="#e6b84a"/></svg><span><b>Tap</b> the board: your whole swarm flies there. Tap a rival Core or post: strike it. Tap your Core: home.</span></div>`,
    `<div>${svgIcon('bastion', '#e6b84a')}<span><b>Hold</b> gold ground beyond your Core's ring (or tap PLANT): spend 15 sparks on a post. <b>Bastion</b> shoots and walls a lane.</span></div>`,
    `<div>${svgIcon('forge', '#e6b84a')}<span><b>Forge</b>: every spark that flies past gets +50% hp. Put it on your attack lane.</span></div>`,
    `<div>${svgIcon('beacon', '#e6b84a')}<span><b>Beacon</b>: claims ground and +1 spark / 4 s (×2 on the Starwell). Break a Core its ring touches and you take it.</span></div>`,
  ].join('');
  const sb = $('seedBtns'); sb.innerHTML = '';
  for (let s = 1; s <= 5; s++) { const b = document.createElement('button'); b.textContent = s; b.onclick = () => startGame(s); sb.appendChild(b); }
  const r = document.createElement('button'); r.className = 'r'; r.textContent = 'random'; r.onclick = () => startGame(6 + ((Math.random() * 9000) | 0)); sb.appendChild(r);
  $('seedLines').innerHTML = [1, 2, 3, 4, 5].map(s => { const m = makeMap(s); return `<div><b>${s}</b> · ${m.desc}. <span class="c">C ${KIND_NAME[m.styles[0]]}</span> · <span class="v">S ${KIND_NAME[m.styles[1]]}</span></div>`; }).join('');
  $('tryBox').innerHTML = '<b>What to try</b><br>' + TRY.join('<br>');
}
function startGame(seed) {
  newGame(seed); closeRadial(); plantArm = false; press = null;
  $('start').hidden = true; $('end').hidden = true; $('hud').hidden = false; $('dock').hidden = false; $('hint').hidden = false;
  hudT = 0; last = performance.now(); acc = 0;
}
function showEnd() {
  const g = G; if (!g || !g.over) return;
  $('endTitle').textContent = g.result ? 'WON' : 'LOST'; $('endTitle').style.color = g.result ? '#e6b84a' : '#ff7a5c';
  $('endCause').textContent = g.cause;
  const me = g.crews[0].stats, b = me.built;
  $('endStats').innerHTML = `<span>time <b>${fmt(g.endAt)}</b></span><span>taps <b>${g.taps}</b></span><span>orders <b>${g.actions}</b></span><span>posts <b>${b.bastion + b.forge + b.beacon}</b></span>`;
  let lines = g.log.slice();
  if (lines.length > 14) lines = lines.slice(0, 6).concat([{ t: -1, text: `… ${lines.length - 13} more …`, sys: true }], lines.slice(-7));
  $('endLog').innerHTML = '<div style="color:#97a0c2;margin-bottom:2px">Decision log · seed ' + g.seed + '</div>' + lines.map(l => `<div class="${l.sys ? 'sys' : ''}"><span class="t">${l.t >= 0 ? fmt(l.t) : ''}</span>${l.text}</div>`).join('') + (g.log.some(l => !l.sys) ? '' : '<div class="sys">no orders given</div>');
  $('end').hidden = false; $('hud').hidden = true; $('dock').hidden = true; $('hint').hidden = true; closeRadial();
}
$('bAgain').onclick = () => startGame(G.seed);
$('bNext').onclick = () => startGame(G.seed >= 5 ? 1 : G.seed + 1);
$('bMenu').onclick = () => { $('end').hidden = true; $('start').hidden = false; G = null; };

// ---------------------------------------------------------------- loop
let last = performance.now(), acc = 0, raf = 0, running = true;
function frame(now) {
  raf = 0; if (!running) return;
  const t0 = performance.now();
  let dt = Math.min(0.1, (now - last) / 1000); last = now;
  checkLongPress();
  if (G && !G.paused) {
    acc += dt; let n = 0;
    while (acc >= DT && n < 4) { if (!G.over || G.t < G.endAt + 1.3) step(); acc -= DT; n++; }
    if (n === 4) acc = 0;
  }
  render(); updateHud(dt);
  const ft = performance.now() - t0;
  if (G && !G.over && G.t > 2) { frameStats.n++; frameStats.sum += ft; if (ft > frameStats.max) frameStats.max = ft; }
  frameStats.last = ft;
  raf = requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  running = !document.hidden;
  if (running && !raf) { last = performance.now(); acc = 0; raf = requestAnimationFrame(frame); }
});
resize(); buildStart(); raf = requestAnimationFrame(frame);

// ---------------------------------------------------------------- test hooks (Playwright)
window.__claims = {
  start: s => { startGame(s); return true; },
  state: () => {
    if (!G) return null; const g = G;
    return { seed: g.seed, t: +g.t.toFixed(2), over: g.over, won: g.result, cause: g.cause || null, taps: g.taps, actions: g.actions,
      crews: g.crews.map(c => ({ alive: c.alive, count: c.count, cap: c.cap, hp: c.alive ? Math.round(c.home.hp) : 0, cores: c.cores.length, beacons: c.beacons || 0, built: c.stats.built, lost: c.stats.lost, style: c.bot ? c.bot.style : null, order: c.order.kind })),
      posts: g.structs.filter(p => p.alive && p.kind !== 'core' && p.kind !== 'turret').map(p => ({ kind: p.kind, crew: p.crew, x: Math.round(p.x), y: Math.round(p.y), hp: Math.round(p.hp), build: +p.build.toFixed(1) })),
      log: g.log.map(l => fmt(l.t) + ' ' + l.text), kills: g.kills };
  },
  map: () => G && G.map,
  order: (kind, x, y, post) => playerOrder(kind, x, y, post),
  ownerAt: (x, y) => ownerAt(x, y),
  plantCheck: (x, y) => plantCheck(0, x, y),
  w2s: (x, y) => toScreen(x, y),
  // run the sim without rendering; policy(api) is called every 0.5 s of sim time
  fast: (sec, policySrc) => {
    if (!G) return null; G.fast = true;
    const policy = policySrc ? new Function('api', 'G', policySrc) : null; const api = window.__claims;
    const end = G.t + sec; let pt = 0;
    while (G.t < end && !(G.over && G.t > G.endAt + 0.1)) { step(); pt -= DT; if (policy && pt <= 0 && !G.over) { pt = 0.5; policy(api, G); } }
    G.fast = false; return api.state();
  },
  perf: () => ({ frames: frameStats.n, avg: frameStats.n ? +(frameStats.sum / frameStats.n).toFixed(3) : 0, max: +frameStats.max.toFixed(2) }),
  resetPerf: () => { frameStats = { n: 0, sum: 0, max: 0, last: 0 }; },
  pause: p => { if (G) G.paused = p; },
  _g: () => G,
  T,
};
})();
</script>
