<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Army lab</title>
  <script type="module" crossorigin src="./assets/index-Dv_3evpg.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BTkSfMFg.css">
</head>
<body>
<div class="app">
  <div class="top">
    <div class="lvl"><b id="lvlNum">Level 1</b><small id="lvlName"></small></div>
    <div class="foes" id="foes"></div>
    <div class="clock" id="clock">0:00</div>
    <button class="icon" id="pause" type="button" aria-label="Pause">❚❚</button>
  </div>
  <div class="board" id="board"></div>
  <div class="hint" id="hint" aria-live="polite"></div>
  <button class="power" id="power" type="button" aria-label="Use your power">
    <span class="fill" id="powerFill"></span>
    <span class="face"><i id="powerIcon">✸</i><b id="powerName">Bomb</b><small id="powerState">charging</small></span>
  </button>
</div>

<div class="over show" id="start">
  <div class="card">
    <h1>Army lab</h1>
    <p>Touch where your ships should go.<br>Break the other Cores to win.</p>
    <button class="big pulse" id="play" type="button">Play</button>
    <div class="levels" id="levels"></div>
    <button class="link" id="mute" type="button">Sound on</button>
  </div>
</div>
<div class="over" id="pauseCard">
  <div class="card">
    <h2>Paused</h2>
    <button class="big" id="resume" type="button">Keep playing</button>
    <div class="row"><button class="mid" id="restart" type="button">Restart level</button><button class="mid" id="toLevels" type="button">Levels</button></div>
  </div>
</div>
<div class="over" id="winCard">
  <div class="card">
    <h2 id="winTitle">Level cleared!</h2>
    <div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>
    <p id="winText"></p>
    <button class="big pulse" id="next" type="button">Next level</button>
    <div class="row"><button class="mid" id="again" type="button">Play again</button><button class="mid" id="winLevels" type="button">Levels</button></div>
  </div>
</div>
<div class="over" id="loseCard">
  <div class="card">
    <h2>Your Core fell</h2>
    <p class="cause" id="loseCause"></p>
    <p id="loseTip"></p>
    <button class="big pulse" id="retry" type="button">Try again</button>
    <div class="row"><button class="mid" id="loseLevels" type="button">Levels</button></div>
  </div>
</div>
</body>
</html>
