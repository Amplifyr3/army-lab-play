<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b18">
<title>Flight · Take the Stars prototype</title>
<style>
  html,body{margin:0;height:100%;background:#080b18;overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8ecf8}
  canvas#c{position:fixed;left:0;top:0;display:block;touch-action:none}
  #sab{position:fixed;left:0;bottom:0;width:1px;height:env(safe-area-inset-bottom);pointer-events:none;visibility:hidden}
  .card{position:fixed;inset:0;display:none;flex-direction:column;justify-content:flex-end;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-sizing:border-box;background:rgba(6,9,20,.78)}
  .card.on{display:flex}
  .box{background:#11172f;border:1px solid #2a3560;border-radius:18px;padding:14px 16px 12px;margin-bottom:10px}
  h1{margin:0 0 6px;font-size:28px;letter-spacing:.04em;font-weight:800}
  .cause{font-size:17px;line-height:1.35;margin:0 0 10px;color:#fff}
  .stats{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:15px;color:#9aa4c4;line-height:1.45}
  .stats b{color:#e8ecf8;text-align:right}
  .btns{display:flex;gap:8px}
  .btn{flex:1;min-height:60px;border-radius:14px;border:1px solid #3a4780;background:#1b2448;color:#e8ecf8;font-size:18px;font-weight:700;cursor:pointer}
  .btn.main{background:#62c8ff;color:#06121c;border-color:#62c8ff}
  .home{display:block;text-align:center;color:#9aa4c4;font-size:14px;padding:12px 0 2px}
  @media (max-height:700px){ h1{font-size:24px} .cause{font-size:15px} .stats{font-size:14px} .btn{min-height:56px} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sab"></div>
<div class="card" id="end">
  <div class="box">
    <h1 id="endTitle">Husk destroyed</h1>
    <div class="cause" id="endCause"></div>
    <div class="stats" id="endStats"></div>
  </div>
  <div class="btns"><button class="btn main" id="bAgain">Again</button><button class="btn" id="bSame">Same seed</button></div>
  <a class="home" href="index.html">All prototypes</a>
</div>
<script>
'use strict';
// =====================================================================
// Flight: a drawn-path starfighter duel for one thumb, prototype E (grey box)
// World 400 x 840: board y 0-560 (top two thirds), panel y 560-840 (the pad, the dice, the buttons)
// =====================================================================
const W = 400, BH = 560, H = 840, B = 32;
const K = 0.9;                                   // pad scale: 1 board px = 0.9 pad px (speed 3 = 137 pad px)
const PO = { x: 200, y: 712 };                    // the pad Craft's centre
const PAD = { x: 4, y: 564, w: 392, h: 188 };
const BTN = { x: 8, y: 758, w: 384, h: 76 };
const C_CRAFT = '#62c8ff', C_HUSK = '#f08a5d', C_SHIELD = '#5b8cff', C_HULL = '#f0f0f0', C_STRAIN = '#ffc53d', C_GOLD = '#e6b84a';
const HEX = { green: '#6fe3a3', white: '#f0f0f0', red: '#ff5a6a' };
const WORD = { green: 'Easy', white: 'Steady', red: 'Hard' };
const DEG = Math.PI / 180, UP = -Math.PI / 2;
const T = { thr1: 83, thr2: 119, tapPx: 12, tapMs: 250, flyMs: 700, revealMs: 300, tumbleMs: 800, settleGap: 80, popMs: 120, autoPassMs: 600 };
const STRIKE = ['Hit', 'Hit', 'Hit', 'Burst', 'Spirit', 'Spirit', 'Blank', 'Blank'];
const DODGE = ['Dodge', 'Dodge', 'Dodge', 'Spirit', 'Spirit', 'Blank', 'Blank', 'Blank'];
const BAG = [['Straight', 2, 3], ['Bank', 1, 2], ['Bank', 2, 3], ['Bank', 3, 1], ['Turn', 1, 2], ['Turn', 2, 2], ['Flip', 2, 1]];
const PHASES = ['Plan', 'Fly', 'Act', 'Shoot'];

// ---------------------------------------------------------------- rng + helpers
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rng = mulberry32(1);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function angN(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function smooth(t) { return t * t * (3 - 2 * t); }
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

// ---------------------------------------------------------------- manoeuvres: one constant-curvature arc, centre to centre
const lenOf = s => B + 40 * s;                    // 72 / 112 / 152
function colourOf(shape, speed) { if (shape === 'Flip') return 'red'; if (shape === 'Turn') return speed >= 3 ? 'red' : 'white'; return speed >= 3 ? 'white' : 'green'; }
function man(shape, speed, side) {
  side = shape === 'Straight' ? 0 : (side || 1);
  const colour = colourOf(shape, speed);
  return { shape, speed, side, colour, label: shape + ' ' + speed + ' · ' + WORD[colour] };
}
function clampStrained(m, strain) {
  if (!m || strain < 1 || m.colour !== 'red') return m;
  const c = man('Turn', 2, m.side || 1); c.clamped = true; c.from = m.label; return c;
}
function theta(m) { return m.shape === 'Bank' ? m.side * Math.PI / 4 : m.shape === 'Turn' ? m.side * Math.PI / 2 : 0; }
function poseAt(p0, m, u, sc) {
  const l = lenOf(m.speed) * (sc || 1), th = theta(m);
  if (!th) return { x: p0.x + Math.cos(p0.h) * l * u, y: p0.y + Math.sin(p0.h) * l * u, h: p0.h };
  const R = l / th, hh = p0.h + th * u;
  return { x: p0.x + R * (Math.sin(hh) - Math.sin(p0.h)), y: p0.y - R * (Math.cos(hh) - Math.cos(p0.h)), h: hh };
}
function endAt(p0, l, th) {
  if (Math.abs(th) < 1e-6) return { x: p0.x + Math.cos(p0.h) * l, y: p0.y + Math.sin(p0.h) * l };
  const R = l / th, hh = p0.h + th;
  return { x: p0.x + R * (Math.sin(hh) - Math.sin(p0.h)), y: p0.y - R * (Math.cos(hh) - Math.cos(p0.h)) };
}
const onBoard = (x, y) => x >= B / 2 && x <= W - B / 2 && y >= B / 2 && y <= BH - B / 2;
// the executed move: stops at the edge of the board if the path leaves it
function execPath(p0, m) {
  const N = 48; let last = 0;
  for (let i = 1; i <= N; i++) {
    const u = i / N, q = poseAt(p0, m, u);
    if (!onBoard(q.x, q.y)) {
      let a = last, b = u;
      for (let k = 0; k < 16; k++) { const mid = (a + b) / 2, r = poseAt(p0, m, mid); if (onBoard(r.x, r.y)) a = mid; else b = mid; }
      // stopped at the edge; the heading reflects off the void so the ship always faces back in (never stuck facing out)
      const e = poseAt(p0, m, a), o = poseAt(p0, m, b);
      let vx = Math.cos(e.h), vy = Math.sin(e.h);
      if (o.x < B / 2 || o.x > W - B / 2) vx = -vx;
      if (o.y < B / 2 || o.y > BH - B / 2) vy = -vy;
      return { uEnd: a, clipped: true, end: { x: e.x, y: e.y, h: Math.atan2(vy, vx) }, faced: e.h };
    }
    last = u;
  }
  const e = poseAt(p0, m, 1); if (m.shape === 'Flip') e.h = angN(e.h + Math.PI);
  return { uEnd: 1, clipped: false, end: e };
}
const ALL15 = [];
for (const sp of [1, 2, 3]) { ALL15.push(man('Straight', sp, 0)); for (const sd of [-1, 1]) { ALL15.push(man('Bank', sp, sd)); ALL15.push(man('Turn', sp, sd)); } }
function padEnd(m) { const e = poseAt({ x: 0, y: 0, h: UP }, m, 1, K); return { x: e.x, y: e.y }; }

// ---------------------------------------------------------------- stroke -> manoeuvre
function resample(pts, step) {
  const out = [{ x: pts[0].x, y: pts[0].y }]; let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    let a = pts[i - 1]; const b = pts[i]; let seg = Math.hypot(b.x - a.x, b.y - a.y);
    while (acc + seg >= step && seg > 0) {
      const t = (step - acc) / seg, p = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
      out.push(p); a = p; seg = Math.hypot(b.x - a.x, b.y - a.y); acc = 0;
    }
    acc += seg;
  }
  const L = pts[pts.length - 1], o = out[out.length - 1];
  if (Math.hypot(L.x - o.x, L.y - o.y) > 0.5) out.push({ x: L.x, y: L.y });
  return out;
}
function smooth5(p) {
  const n = p.length, o = new Array(n);
  for (let i = 0; i < n; i++) { let sx = 0, sy = 0, c = 0; for (let j = i - 2; j <= i + 2; j++) if (j >= 0 && j < n) { sx += p[j].x; sy += p[j].y; c++; } o[i] = { x: sx / c, y: sy / c }; }
  o[0] = p[0]; o[n - 1] = p[n - 1]; return o;
}
function analyse(raw) {
  if (!raw || raw.length < 2) return null;
  const a = raw[0], z = raw[raw.length - 1];
  let L = 0; for (let i = 1; i < raw.length; i++) L += Math.hypot(raw[i].x - raw[i - 1].x, raw[i].y - raw[i - 1].y);
  const sm = smooth5(resample(raw, 3)), s = resample(sm, 6);
  if (s.length < 2) return null;
  // initial heading from the first ~14 px; the bend counts from the nose (a stroke that starts sideways has already turned)
  let k = 1; const want = Math.min(14, L / 4);
  while (k < s.length - 1 && Math.hypot(s[k].x - s[0].x, s[k].y - s[0].y) < want) k++;
  const h0 = Math.atan2(s[k].y - s[0].y, s[k].x - s[0].x);
  let bend = angN(h0 - UP), prev = h0;
  for (let i = k + 1; i < s.length; i++) { const h = Math.atan2(s[i].y - s[i - 1].y, s[i].x - s[i - 1].x); bend += angN(h - prev); prev = h; }
  const dx = z.x - a.x, dy = z.y - a.y, disp = Math.hypot(dx, dy);
  let reach = 0; for (const p of sm) reach = Math.max(reach, Math.hypot(p.x - a.x, p.y - a.y));
  const ab = Math.abs(bend);
  const shape = (ab > 112.5 * DEG || dy > 6) ? 'Flip' : ab < 22.5 * DEG ? 'Straight' : ab < 67.5 * DEG ? 'Bank' : 'Turn';
  const side = bend > 0.02 ? 1 : bend < -0.02 ? -1 : (dx >= 0 ? 1 : -1);
  const tq = shape === 'Bank' ? Math.PI / 4 : shape === 'Turn' ? Math.PI / 2 : 0;
  const lest = shape === 'Flip' ? reach : disp * (tq ? tq / (2 * Math.sin(tq / 2)) : 1);   // the arc length the chord implies
  const speed = lest < T.thr1 ? 1 : lest < T.thr2 ? 2 : 3;
  return { m: man(shape, speed, side), bend: bend / DEG, disp, lest, L };
}
function tapPick(p) {
  if (p.y > 10) return man('Flip', 2, p.x >= 0 ? 1 : -1);      // behind the Craft: the Flip
  let best = null, bd = 1e9;
  for (const m of ALL15) { const e = padEnd(m), d = Math.hypot(e.x - p.x, e.y - p.y); if (d < bd) { bd = d; best = m; } }
  return best;
}

// ---------------------------------------------------------------- game state
let seed = 1, round = 0, phase = 'plan', sub = '', clock = 0, ANIM = true, timeScale = 1;
let craft, husk, planRaw = null, plan = null, hp = null, lastAnalysis = null;
let SK = null, shownStroke = null, tapMark = null, revealed = false;
let tgt = null, huskTgt = null, picked = false, tray = [], noTarget = false;
let tasks = [], toasts = [], fanT0 = 0, sightsT0 = 0, flash = 0, shake = { t0: -1e9, amp: 0 };
let stats = null, over = null;
function newShip(kind, x, y, h) { return { kind, x, y, h, shields: 2, hull: 3, strain: 0, focus: false, clipped: false, fl: null }; }
const pose = s => ({ x: s.x, y: s.y, h: s.h });
function newStats() { return { strainTaken: 0, huskStrain: 0, bestShot: 0, arcDodges: 0, landed: 0, missed: 0, inHuskSights: 0, huskLanded: 0, killBurst: false, killHits: 0, clips: 0, focuses: 0, flips: 0, lastHuskDmg: 0 }; }

function after(ms, fn) { if (!ANIM) { fn(); return; } tasks.push({ at: clock + ms, fn }); }
function runTasks() {
  for (let guard = 0; guard < 64; guard++) {
    let idx = -1, at = 1e18;
    for (let i = 0; i < tasks.length; i++) if (tasks[i].at <= clock && tasks[i].at < at) { idx = i; at = tasks[i].at; }
    if (idx < 0) return;
    tasks.splice(idx, 1)[0].fn();
  }
}
function toast(text, col) { toasts.push({ text, col: col || '#fff', t0: clock }); if (toasts.length > 3) toasts.shift(); }

function restart(sd) {
  seed = sd | 0 || 1; rng = mulberry32(seed * 31 + 7);
  const r = mulberry32(seed * 7919 + 3);
  craft = newShip('craft', 200, 470, UP);
  husk = newShip('husk', 120 + r() * 160, 92 + r() * 20, Math.PI / 2 + (r() - 0.5) * 50 * DEG);
  round = 0; tasks = []; toasts = []; stats = newStats(); over = null; tray = []; buildBg();
  document.getElementById('end').classList.remove('on');
  try { history.replaceState(null, '', location.pathname + '?seed=' + seed); } catch (e) { /* file:// may refuse */ }
  startRound();
}
function startRound() {
  round++; phase = 'plan'; sub = '';
  craft.focus = false; craft.clipped = false; husk.clipped = false; craft.flown = husk.flown = false;
  planRaw = plan = null; lastAnalysis = null; shownStroke = null; tapMark = null; SK = null; revealed = false;
  tray = []; tgt = huskTgt = null; picked = false; noTarget = false;
  hp = huskChoose(); fanT0 = clock;
}
// the Husk: a weighted bag, biased to keep the Craft's current position in its Sights and to stay on the board
function huskChoose() {
  const cands = [];
  for (const [shape, speed, n] of BAG) {
    const sides = shape === 'Straight' ? [0] : [-1, 1];
    for (const sd of sides) {
      const m = man(shape, speed, sd);
      if (husk.strain >= 1 && m.colour === 'red') continue;
      const ex = execPath(pose(husk), m);
      let sc = ex.clipped ? -9 : 3;
      if (sightsOf(ex.end, craft.x, craft.y)) sc += 2;
      sc += 0.25 * n + rng() * 2.2;
      cands.push([sc, m]);
    }
  }
  cands.sort((p, q) => q[0] - p[0]);
  return cands[0][1];
}
function sightsOf(s, tx, ty) {
  const dx = tx - s.x, dy = ty - s.y, d = Math.hypot(dx, dy);
  if (d > 300) return null;
  if (Math.abs(angN(Math.atan2(dy, dx) - s.h)) > Math.PI / 4 + 1e-9) return null;
  return { d, band: d <= 100 ? 'Close' : d <= 200 ? 'Mid' : 'Far' };
}
function setPlan(m) { planRaw = m; plan = clampStrained(m, craft.strain); }

// ---------------------------------------------------------------- strokes (touch and the test API share this path)
function strokeBegin(p, now) { if (phase !== 'plan') return; SK = { raw: [p], t0: now, maxD: 0 }; }
function strokeMove(p) {
  if (!SK) return;
  const a = SK.raw[0]; SK.raw.push(p);
  SK.maxD = Math.max(SK.maxD, Math.hypot(p.x - a.x, p.y - a.y) * S);
  if (SK.maxD >= T.tapPx) { tapMark = null; const r = analyse(SK.raw); if (r) { lastAnalysis = r; setPlan(r.m); } }
}
function strokeEnd(now) {
  if (!SK) return;
  const sk = SK; SK = null;
  if (sk.maxD < T.tapPx) {
    if (now - sk.t0 < T.tapMs) { tapMark = sk.raw[0]; shownStroke = null; lastAnalysis = null; setPlan(tapPick(sk.raw[0])); vib(8); blip(520, 0.05, 'sine', 0.03); }
    return;
  }
  shownStroke = sk.raw;
  const r = analyse(sk.raw); if (r) { lastAnalysis = r; setPlan(r.m); }
  vib(8);
}

// ---------------------------------------------------------------- the round: Plan -> Fly -> Act -> Shoot
function fly() {
  if (phase !== 'plan' || !plan || over) return false;
  phase = 'fly'; sub = 'reveal'; revealed = true; SK = null; vib(12); blip(330, 0.12, 'triangle', 0.05);
  after(T.revealMs, () => {
    sub = 'husk';
    flyShip(husk, hp, () => { sub = 'craft'; flyShip(craft, plan, enterAct); });
  });
  return true;
}
function flyShip(ship, m, cb) {
  const p0 = pose(ship), ex = execPath(p0, m);
  ship.fl = { p0, m, ex, t0: clock, dur: T.flyMs };
  after(T.flyMs, () => {
    ship.x = ex.end.x; ship.y = ex.end.y; ship.h = ex.end.h; ship.fl = null; ship.flown = true;
    const before = ship.strain;
    if (ex.clipped) { ship.strain += (m.colour === 'red' ? 1 : 0) + 1; ship.clipped = true; }
    else if (m.colour === 'red') ship.strain += 1;
    else if (m.colour === 'green') ship.strain = Math.max(0, ship.strain - 1);
    const gained = Math.max(0, ship.strain - before);
    if (ship === craft) { stats.strainTaken += gained; if (ex.clipped) stats.clips++; if (m.shape === 'Flip') stats.flips++; }
    else stats.huskStrain += gained;
    if (ex.clipped) { toast(ship === craft ? 'Clipped the void · +1 Strain' : 'Husk clipped the void · +1 Strain', ship === craft ? HEX.red : C_HUSK); vib(25); }
    for (let i = 0; i < 10; i++) addParticle(ship.x - Math.cos(ship.h) * 14, ship.y - Math.sin(ship.h) * 14, -Math.cos(ship.h) * 40 + (Math.random() - 0.5) * 50, -Math.sin(ship.h) * 40 + (Math.random() - 0.5) * 50, ship === craft ? 0 : 1);
    cb();
  });
}
function enterAct() {
  phase = 'act'; sub = '';
  if (craft.strain >= 1 || craft.clipped) after(T.autoPassMs, () => { if (phase === 'act') pass(); });
}
function focus() {
  if (phase !== 'act' || craft.strain >= 1 || craft.clipped) return false;
  craft.focus = true; stats.focuses++; vib(15); blip(784, 0.18, 'sine', 0.05);
  sub = 'focused'; after(220, enterShoot);
  return true;
}
function pass() { if (phase !== 'act' || sub === 'focused') return false; enterShoot(); return true; }
function enterShoot() {
  if (phase !== 'act') return;
  phase = 'shoot'; sightsT0 = clock; tray = []; picked = false;
  tgt = sightsOf(craft, husk.x, husk.y); huskTgt = sightsOf(husk, craft.x, craft.y);
  if (huskTgt) stats.inHuskSights++;
  if (tgt && !huskTgt) { stats.arcDodges++; toast('Out of its Sights', HEX.green); }
  noTarget = !tgt;
  blip(990, 0.06, 'square', 0.02);
  if (tgt) sub = 'pick';
  else if (huskTgt) { sub = 'wait'; after(650, huskFire); }
  else sub = 'done';
}
function pick() { if (phase === 'shoot' && sub === 'pick') { picked = true; sub = 'ready'; vib(8); blip(660, 0.05, 'sine', 0.03); return true; } return false; }
function roll() {
  if (phase !== 'shoot' || sub !== 'ready') return false;
  sub = 'roll';
  const nA = 3 + (tgt.band === 'Close' ? 1 : 0), nD = 2 + (tgt.band === 'Far' ? 1 : 0);
  startRoll('craft', nA, nD, craft.focus, false, () => {
    if (husk.hull <= 0) { sub = 'over'; after(900, () => endGame('win')); return; }
    if (huskTgt) { sub = 'wait'; after(700, huskFire); } else sub = 'done';
  });
  return true;
}
function huskFire() {
  if (phase !== 'shoot') return;
  sub = 'husk';
  startRoll('husk', 2, 2 + (huskTgt.band === 'Far' ? 1 : 0), false, craft.focus, () => {
    if (craft.hull <= 0) { sub = 'over'; after(900, () => endGame('lose')); return; }
    sub = 'done';
  });
}
function next() { if (phase === 'shoot' && sub === 'done') { startRound(); return true; } return false; }

// ---------------------------------------------------------------- dice
const face = kind => (kind === 'strike' ? STRIKE : DODGE)[Math.floor(rng() * 8)];
function startRoll(who, nA, nD, attF, defF, cb) {
  const att = [], def = [];
  for (let i = 0; i < nA; i++) att.push({ f: face('strike'), kind: 'strike', settled: false, st: 0, flash: -1e9 });
  for (let i = 0; i < nD; i++) def.push({ f: face('dodge'), kind: 'dodge', settled: false, st: 0, flash: -1e9 });
  for (const d of att.concat(def)) d.rolled = d.f;
  const row = { who, att, def, line: '', t0: clock, attF, defF, res: null };
  tray.push(row);
  const all = att.concat(def);
  all.forEach((d, i) => after(T.tumbleMs + i * T.settleGap, () => { d.settled = true; d.st = clock; blip(587 * Math.pow(2, [0, 2, 4, 7, 9, 12, 14][i % 7] / 12), 0.045, 'sine', 0.035); }));
  after(T.tumbleMs + (all.length - 1) * T.settleGap + 150, () => {
    let any = false;
    if (attF) for (const d of att) if (d.f === 'Spirit') { d.f = 'Hit'; d.flash = clock; any = true; }
    if (defF) for (const d of def) if (d.f === 'Spirit') { d.f = 'Dodge'; d.flash = clock; any = true; }
    if (any) blip(1175, 0.12, 'sine', 0.04);
    after(any ? 260 : 60, () => { resolveRow(row); cb(); });
  });
}
function resolveRow(row) {
  const ship = row.who === 'craft' ? husk : craft;
  let h = 0, b = 0, d = 0;
  for (const x of row.att) { if (x.f === 'Hit') h++; else if (x.f === 'Burst') b++; }
  for (const x of row.def) if (x.f === 'Dodge') d++;
  const H0 = h, B0 = b, D0 = d;
  const c1 = Math.min(d, h); h -= c1; d -= c1;
  const c2 = Math.min(d, b); b -= c2;
  const sh = Math.min(ship.shields, h); ship.shields -= sh;

      b.push({ id: 'roll', ...BTN, label: 'ROLL', on: sub === 'ready', main: true, fn: roll });
    } else if (sub === 'done') b.push({ id: 'next', ...BTN, label: 'NEXT ROUND', on: true, main: true, fn: next });

}
function drawButton(c, bt) {
  if (bt.card) return drawCard(c, bt);
  roundRect(c, bt.x, bt.y, bt.w, bt.h, 16);
  c.fillStyle = bt.on ? (bt.main ? '#62c8ff' : '#1b2448') : '#141a33'; c.fill();
  c.strokeStyle = bt.on ? (bt.main ? '#a8e4ff' : '#3a4780') : '#242c52'; c.lineWidth = 1.5; c.stroke();
  if (downId === bt.id && bt.on) { c.fillStyle = 'rgba(255,255,255,0.15)'; c.fill(); }
  c.fillStyle = bt.on ? (bt.main ? '#06121c' : '#e8ecf8') : '#5d6788'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = font(bt.h > 120 ? 26 : 22, 800); c.fillText(bt.label, bt.x + bt.w / 2, bt.y + bt.h / 2 - (bt.subl ? 12 : 0));
  if (bt.subl) { c.font = font(14, 600); c.fillStyle = bt.on ? (bt.main ? '#0c2a3d' : '#9aa4c4') : (bt.label === 'Strained' ? C_STRAIN : '#7d86a6'); c.fillText(bt.subl, bt.x + bt.w / 2, bt.y + bt.h / 2 + 20); }
}
function drawCard(c, bt) {
  roundRect(c, bt.x, bt.y, bt.w, bt.h, 16);
  c.fillStyle = picked ? '#2a1a14' : '#1a1730'; c.fill();
  const pulse = 0.5 + 0.5 * Math.sin(clock / 260);
  c.strokeStyle = picked ? C_HUSK : 'rgba(240,138,93,' + (0.45 + 0.4 * pulse) + ')'; c.lineWidth = picked ? 3 : 2; c.stroke();
  drawShip(c, bt.x + 40, bt.y + 46, UP, 'husk', 1, 1.2);
  c.textAlign = 'left'; c.textBaseline = 'middle';
  c.font = font(22, 800); c.fillStyle = '#fff'; c.fillText('Husk · ' + tgt.band, bt.x + 76, bt.y + 30);
  let px = bt.x + 84; px = pips(c, px, bt.y + 62, husk.shields, 2, C_SHIELD, 5.5, 15) + 6; pips(c, px, bt.y + 62, husk.hull, 3, C_HULL, 5.5, 15);
  c.font = font(15, 600);
  const bonus = tgt.band === 'Close' ? '+1 Strike die (Close)' : tgt.band === 'Far' ? '+1 Dodge die (Far)' : '3 Strike vs 2 Dodge';
  c.fillStyle = tgt.band === 'Close' ? HEX.green : tgt.band === 'Far' ? C_STRAIN : '#c9d0e6'; c.fillText(bonus, bt.x + 76, bt.y + 92);
  c.fillStyle = huskTgt ? C_HUSK : HEX.green; c.font = font(14, 600);
  c.fillText(huskTgt ? 'You are in its Sights: it fires back' : 'You are out of its Sights', bt.x + 76, bt.y + 118);
  c.textAlign = 'right'; c.font = font(16, 800); c.fillStyle = picked ? C_HUSK : '#fff';

function glyph(c, f, cx, cy, s, col) {
  const r = s * 0.3; c.fillStyle = col; c.strokeStyle = col;
  if (f === 'Hit') { c.beginPath(); c.moveTo(cx, cy - r); c.lineTo(cx + r * 0.78, cy); c.lineTo(cx, cy + r); c.lineTo(cx - r * 0.78, cy); c.closePath(); c.fill(); }
  else if (f === 'Burst') { c.beginPath(); for (let i = 0; i < 8; i++) { const a = -Math.PI / 2 + i * Math.PI / 4, rr = i % 2 ? r * 0.3 : r * 1.1; i ? c.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr) : c.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } c.closePath(); c.fill(); }
  else if (f === 'Spirit') { c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.27 : r * 0.66; i ? c.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr) : c.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } c.closePath(); c.fill(); }

}
function drawDie(c, d, x, y, s, owner, i) {
  const settled = d.settled || !ANIM;
  let f = d.f, jx = 0, jy = 0, rot = 0, sc = 1;
  if (!settled) {
    const list = d.kind === 'strike' ? STRIKE : DODGE;
    f = list[(Math.floor(clock / 70) * 7 + i * 3) % 8];
    jx = Math.sin(clock * 0.05 + i * 1.7) * 2.5; jy = Math.cos(clock * 0.043 + i * 2.3) * 2.5; rot = Math.sin(clock * 0.03 + i) * 0.25;
  } else if (ANIM) { const k = clamp((clock - d.st) / 140, 0, 1); sc = 1 + 0.16 * (1 - k); }

}
function drawRow(c, row, y) {
  const s = 40, gap = 6, nA = row.att.length, nD = row.def.length, vsW = 30;
  const total = nA * (s + gap) - gap + vsW + nD * (s + gap) - gap;
  let x = (W - total) / 2;
  const aOwner = row.who, dOwner = row.who === 'craft' ? 'husk' : 'craft';
  row.att.forEach((d, i) => { drawDie(c, d, x, y, s, aOwner, i); x += s + gap; });
  x += vsW / 2 - gap / 2; c.fillStyle = '#9aa4c4'; c.font = font(14, 700); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('vs', x, y + s / 2); x += vsW / 2 + gap / 2;
  row.def.forEach((d, i) => { drawDie(c, d, x, y, s, dOwner, nA + i); x += s + gap; });
  if (row.res) {
    c.font = font(15, 700); c.textAlign = 'center'; c.fillStyle = (row.res.shield + row.res.hull) ? (row.who === 'craft' ? '#ffffff' : C_HUSK) : '#9aa4c4';
    c.fillText(row.line, W / 2, y + s + 18);

}
function drawPad(c) {
  roundRect(c, PAD.x, PAD.y, PAD.w, PAD.h, 18); c.fillStyle = '#0f1530'; c.fill();
  c.strokeStyle = 'rgba(98,200,255,0.18)'; c.lineWidth = 1.2; c.stroke();
  const p0 = { x: PO.x, y: PO.y, h: UP };
  drawFan(c, p0, K, '98,200,255', 0.9);
  // the 15 landing spots (the tap fallback) and the Flip spot behind
  c.fillStyle = 'rgba(200,225,255,0.22)';
  for (const m of ALL15) { const e = padEnd(m); c.beginPath(); c.arc(PO.x + e.x, PO.y + e.y, 2.6, 0, 7); c.fill(); }
  
  // the raw stroke, thin
  const raw = SK && SK.maxD >= T.tapPx ? SK.raw : shownStroke;
  if (raw && raw.length > 1) {
    c.strokeStyle = 'rgba(232,236,248,0.4)'; c.lineWidth = 1.6; c.lineJoin = 'round'; c.beginPath();
    raw.forEach((p, i) => i ? c.lineTo(PO.x + p.x, PO.y + p.y) : c.moveTo(PO.x + p.x, PO.y + p.y)); c.stroke();
  }
  if (tapMark) { c.strokeStyle = 'rgba(232,236,248,0.6)'; c.lineWidth = 1.5; c.beginPath(); c.arc(PO.x + tapMark.x, PO.y + tapMark.y, 9, 0, 7); c.stroke(); }
  // the quantised manoeuvre, bold
  if (plan) {
    const col = HEX[plan.colour];
    c.lineCap = 'round'; c.strokeStyle = col; c.lineWidth = 6; pathLine(c, p0, plan, 1, K); c.stroke();
    const e = poseAt(p0, plan, 1, K);
    if (plan.shape === 'Flip') { c.lineWidth = 3; c.beginPath(); c.arc(e.x + plan.side * 9, e.y, 9, plan.side > 0 ? Math.PI : 0, plan.side > 0 ? 0 : Math.PI, plan.side < 0); c.stroke(); }
    drawShip(c, e.x, e.y, plan.shape === 'Flip' ? -UP : e.h, 'craft', 0.55, K);
  }
  drawShip(c, PO.x, PO.y, UP, 'craft', 1, K);
  // label under the Craft
  c.textAlign = 'center'; c.textBaseline = 'middle';
  if (plan) { c.font = font(19, 800); c.fillStyle = HEX[plan.colour]; c.fillText(plan.label, PO.x, PO.y + 30); }
  else if (round <= 2) { c.font = font(15, 600); c.fillStyle = 'rgba(200,215,240,0.75)'; c.fillText('Draw from your Craft, or tap a spot', PO.x, PO.y + 30); }
  // header: Strain, the strained notice, the void warning
  c.textAlign = 'right'; c.font = font(14, 700); c.fillStyle = C_STRAIN; c.fillText('Strain', PAD.x + PAD.w - 50, PAD.y + 18);

}
function drawPanel(c) {
  if (phase === 'plan') drawPad(c);
  else if (phase === 'fly') {

    c.font = font(20, 800); c.fillStyle = '#e8ecf8'; c.fillText(sub === 'reveal' ? 'Revealing…' : sub === 'husk' ? 'The Husk flies' : 'Your Craft flies', 200, 600);
    c.font = font(18, 700);
    c.fillStyle = C_HUSK; c.fillText('Husk: ' + hp.label, 200, 650);
    c.fillStyle = HEX[plan.colour]; c.fillText('Craft: ' + plan.label, 200, 690);
  } else if (phase === 'act') {
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = font(20, 800); c.fillStyle = '#e8ecf8';
    c.fillText(craft.clipped ? 'Clipped the void: no action' : craft.strain >= 1 ? 'Strained: no Focus' : 'Act', 200, 588);
    c.font = font(15, 600); c.fillStyle = '#9aa4c4';
    c.fillText(craft.clipped || craft.strain >= 1 ? 'Fly an Easy move to clear Strain' : 'Focus: Spirit faces count as Hits and Dodges', 200, 616);
  } else if (phase === 'shoot') {
    const slots = [576, 664];
    if (noTarget) { c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = font(19, 800); c.fillStyle = '#9aa4c4'; c.fillText('No target in Sights', 200, 600); if (!huskTgt) { c.font = font(15, 600); c.fillText('and you are out of its Sights', 200, 630); } }
    tray.forEach((row, i) => drawRow(c, row, slots[noTarget ? 1 : i] || slots[1]));

function render() {
  const c = g;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = '#080b18'; c.fillRect(0, 0, cv.width, cv.height);
  c.fillStyle = '#0b1022'; c.fillRect(0, Math.round((OY + BH * S) * DPR), cv.width, cv.height);
  c.setTransform(S * DPR, 0, 0, S * DPR, OX * DPR, OY * DPR);
  drawBoard(c);
  drawTop(c);
  drawPanel(c);
}

// ---------------------------------------------------------------- input: one finger
const toWorld = (sx, sy) => ({ x: (sx - OX) / S, y: (sy - OY) / S });
const padOf = w => ({ x: w.x - PO.x, y: w.y - PO.y });
const inRect = (w, r) => w.x >= r.x && w.x <= r.x + r.w && w.y >= r.y && w.y <= r.y + r.h;
let G = null, downId = null;
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault(); audioOn();
  if (G || over) return;                                  // one finger: a second pointer is ignored
  const w = toWorld(ev.clientX, ev.clientY);
  layoutButtons();
  const bt = BTNS.find(b => inRect(w, b));
  try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* synthetic pointer */ }
  if (bt) { G = { id: ev.pointerId, kind: 'btn', bid: bt.id }; downId = bt.id; return; }
  if (phase === 'plan' && inRect(w, PAD)) { G = { id: ev.pointerId, kind: 'pad' }; strokeBegin(padOf(w), performance.now()); return; }
  if (phase === 'shoot' && sub === 'pick' && w.y < BH && Math.hypot(w.x - husk.x, w.y - husk.y) <= Math.max(28 / S, 30)) { pick(); }
  G = { id: ev.pointerId, kind: 'none' };
}, { passive: false });
cv.addEventListener('pointermove', ev => {
  if (!G || ev.pointerId !== G.id) return;
  ev.preventDefault();
  if (G.kind === 'pad') strokeMove(padOf(toWorld(ev.clientX, ev.clientY)));
}, { passive: false });
function endPointer(ev, cancel) {
  if (!G || ev.pointerId !== G.id) return;
  const gs = G; G = null;
  downId = null;
  if (gs.kind === 'pad') { if (cancel) SK = null; else strokeEnd(performance.now()); }
  if (gs.kind === 'btn' && !cancel) {
    layoutButtons();
    const w = toWorld(ev.clientX, ev.clientY), bt = BTNS.find(b => b.id === gs.bid);
    if (bt && bt.on && inRect(w, bt)) bt.fn();
  }
}
cv.addEventListener('pointerup', ev => endPointer(ev, false));
cv.addEventListener('pointercancel', ev => endPointer(ev, true));
document.addEventListener('gesturestart', e => e.preventDefault());

// ---------------------------------------------------------------- loop + perf sampler
const perfS = [];
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - (last || now)) / 1000); last = now;
  const t0 = performance.now();
  if (ANIM) clock += dt * 1000 * timeScale;
  runTasks();
  stepParticles(dt * timeScale);
  render();
  perfS.push(performance.now() - t0); if (perfS.length > 300) perfS.shift();
}
window.addEventListener('resize', resize);

// ---------------------------------------------------------------- test API
const ship = s => ({ x: +s.x.toFixed(2), y: +s.y.toFixed(2), heading: +s.h.toFixed(4), shields: s.shields, hull: s.hull, strain: s.strain, focus: s.focus, clipped: s.clipped });

window.__fl = {
  state() {
    const ex = plan ? execPath(pose(craft), plan) : null;
    return {
      phase, sub, round, seed, over,
      craft: ship(craft), husk: ship(husk),
      plan: plan ? { ...manOut(plan), end: { x: +ex.end.x.toFixed(2), y: +ex.end.y.toFixed(2), heading: +ex.end.h.toFixed(4) }, clipped: ex.clipped } : null,
      planRaw: manOut(planRaw), huskPlan: manOut(hp), analysis: lastAnalysis && { bend: +lastAnalysis.bend.toFixed(1), lest: +lastAnalysis.lest.toFixed(1), disp: +lastAnalysis.disp.toFixed(1) },
      flags: { target: tgt && { band: tgt.band, d: +tgt.d.toFixed(1) }, huskTarget: huskTgt && { band: huskTgt.band, d: +huskTgt.d.toFixed(1) }, picked, noTarget,
        tray: tray.map(r => ({ who: r.who, att: r.att.map(d => d.f), def: r.def.map(d => d.f), rolledAtt: r.att.map(d => d.rolled), rolledDef: r.def.map(d => d.rolled), res: r.res, line: r.line, focusAtt: r.attF, focusDef: r.defF })),
        tasks: tasks.length, stats: { ...stats } },

  },
  stroke(points, ms) { if (phase !== 'plan' || !points || !points.length) return null; strokeBegin(points[0], 0); for (let i = 1; i < points.length; i++) strokeMove(points[i]); strokeEnd(ms || 0); return manOut(plan); },
  fly, focus, pass, pick, roll, next,
  rollDice(kind, n) { const out = []; for (let i = 0; i < n; i++) out.push(face(kind)); return out; },
  seed(n) { restart(n); return seed; },
  perf() { const s = perfS.slice().sort((a, b) => a - b); return { frames: s.length, p50: s.length ? s[Math.floor(s.length * 0.5)] : 0, p95: s.length ? s[Math.floor(s.length * 0.95)] : 0, max: s.length ? s[s.length - 1] : 0 }; },
  resetPerf() { perfS.length = 0; },
  toScreen(wx, wy) { return { x: OX + wx * S, y: OY + wy * S }; },
  padToScreen(px, py) { return { x: OX + (PO.x + px) * S, y: OY + (PO.y + py) * S }; },
  padEnd(shape, speed, side) { return padEnd(man(shape, speed, side)); },
  anim(on) { ANIM = !!on; if (!ANIM) { while (tasks.length) { const t = tasks.shift(); t.fn(); } } return ANIM; },
  btn(id) { layoutButtons(); const b = BTNS.find(x => x.id === id); return b ? { x: OX + (b.x + b.w / 2) * S, y: OY + (b.y + b.h / 2) * S, on: b.on, h: b.h * S, w: b.w * S } : null; },
  get S() { return S; }, T, STRIKE, DODGE,

    place(who, x, y, h) { const s = who === 'husk' ? husk : craft; s.x = x; s.y = y; if (h != null) s.h = h; if (phase === 'plan' && who === 'craft') setPlan(planRaw); },

// ---------------------------------------------------------------- boot
const qs = new URLSearchParams(location.search);
