<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b18">
<title>Flight · Take the Stars prototype</title>
<style>
  html,body{margin:0;height:100%;background:#080b18;overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;

  button{font-family:inherit}
  canvas#c{position:fixed;left:0;top:0;display:block;touch-action:none}

  .card.on{display:flex}
  .box{background:#11172f;border:1px solid #2a3560;border-radius:18px;padding:14px 16px 12px;margin-bottom:10px}

  .stats b{color:#e8ecf8;text-align:right}
  .btns{display:flex;gap:8px}

  .btn.main{background:#62c8ff;color:#06121c;border-color:#62c8ff}
  .home{display:block;text-align:center;color:#9aa4c4;font-size:14px;padding:12px 0 2px}
  .link{display:block;width:100%;background:none;border:0;color:#9aa4c4;font-size:15px;padding:14px 0 4px;min-height:44px;cursor:pointer}
  .tip{font-size:15px;line-height:1.35;margin:0 0 10px;color:#ffc9b0}
  .tip:empty{display:none}
  .lede{font-size:15px;line-height:1.4;color:#9aa4c4;margin:0 0 12px}
  .lede b{color:#ffc9b0;font-weight:700}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;min-height:48px;border-radius:12px;border:1px solid #3a4780;background:#141a33;color:#9aa4c4;font-size:16px;font-weight:700}
  .seg button.on{background:#2a3560;color:#fff;border-color:#62c8ff}

    border-radius:16px;border:1px solid #6a3a2a;border-left:6px solid #f08a5d;background:#1a1426;color:#e8ecf8;cursor:pointer}

<body>
<canvas id="c"></canvas>
<div id="sab"></div>
<div class="card" id="end">
  <div class="box">
    <h1 id="endTitle">Rival destroyed</h1>
    <div class="cause" id="endCause"></div>
    <div class="tip" id="endTip"></div>
    <div class="stats" id="endStats"></div>
  </div>
  <div class="btns"><button class="btn main" id="bAgain">Again</button><button class="btn" id="bSame">Same seed</button></div>
  <button class="link" id="bRivals">Pick another rival</button>
</div>
<div class="card" id="start">
  <div class="box">
    <h1>Pick a rival</h1>
    <div class="lede">Same dice, Focus and Strain as you. It plans before you draw and never sees your path.
      <b>Watch its engine:</b> in Plan it leans the way it will turn. Mostly.</div>
    <div class="seg" id="lvl"><button data-l="easy">Easy</button><button data-l="medium" class="on">Medium</button><button data-l="hard">Hard</button></div>
  </div>
  <button class="rcard" data-r="ram"><b>Ram</b><span>Noses straight at you and jousts. Never looks back.</span></button>
  <button class="rcard" data-r="kite"><b>Kite</b><span>Holds Mid range and circles. Always the same way.</span></button>
  <button class="rcard" data-r="wisp"><b>Wisp</b><span>Slips out of your Sights. Flips when you get behind it.</span></button>
  <a class="home" href="index.html">All prototypes</a>
</div>
<script>
'use strict';
// =====================================================================
// Flight: a drawn-path starfighter duel for one thumb, prototype E (grey box)
// World 400 x 840: board y 0-560 (top two thirds), panel y 560-840 (the pad, the dice, the buttons)
// =====================================================================
const W = 400, BH = 560, H = 840, B = 32;
const K = 0.9;                                   // pad scale: 1 board px = 0.9 pad px (speed 3 = 137 pad px)
const PO = { x: 200, y: 712 };                    // the pad Craft's centre
const PAD = { x: 4, y: 564, w: 392, h: 188 };
const BTN = { x: 8, y: 758, w: 384, h: 76 };
const C_CRAFT = '#62c8ff', C_HUSK = '#f08a5d', C_SHIELD = '#5b8cff', C_HULL = '#f0f0f0', C_STRAIN = '#ffc53d', C_GOLD = '#e6b84a';
const HEX = { green: '#6fe3a3', white: '#f0f0f0', red: '#ff5a6a' };
const WORD = { green: 'Easy', white: 'Steady', red: 'Hard' };
const DEG = Math.PI / 180, UP = -Math.PI / 2;
const T = { thr1: 83, thr2: 119, tapPx: 12, tapMs: 250, flyMs: 700, revealMs: 300, tumbleMs: 800, settleGap: 80, popMs: 120, autoPassMs: 600 };
const STRIKE = ['Hit', 'Hit', 'Hit', 'Burst', 'Spirit', 'Spirit', 'Blank', 'Blank'];
const DODGE = ['Dodge', 'Dodge', 'Dodge', 'Spirit', 'Spirit', 'Blank', 'Blank', 'Blank'];
const PHASES = ['Plan', 'Fly', 'Act', 'Shoot'];

// ---------------------------------------------------------------- rng + helpers
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rng = mulberry32(1);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function angN(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function smooth(t) { return t * t * (3 - 2 * t); }
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

// ---------------------------------------------------------------- manoeuvres: one constant-curvature arc, centre to centre
const lenOf = s => B + 40 * s;                    // 72 / 112 / 152
function colourOf(shape, speed) { if (shape === 'Flip') return 'red'; if (shape === 'Turn') return speed >= 3 ? 'red' : 'white'; return speed >= 3 ? 'white' : 'green'; }
function man(shape, speed, side) {
  side = shape === 'Straight' ? 0 : (side || 1);
  const colour = colourOf(shape, speed);
  return { shape, speed, side, colour, label: shape + ' ' + speed + ' · ' + WORD[colour] };
}
function clampStrained(m, strain) {
  if (!m || strain < 1 || m.colour !== 'red') return m;
  const c = man('Turn', 2, m.side || 1); c.clamped = true; c.from = m.label; return c;
}
function theta(m) { return m.shape === 'Bank' ? m.side * Math.PI / 4 : m.shape === 'Turn' ? m.side * Math.PI / 2 : 0; }
function poseAt(p0, m, u, sc) {
  const l = lenOf(m.speed) * (sc || 1), th = theta(m);
  if (!th) return { x: p0.x + Math.cos(p0.h) * l * u, y: p0.y + Math.sin(p0.h) * l * u, h: p0.h };
  const R = l / th, hh = p0.h + th * u;
  return { x: p0.x + R * (Math.sin(hh) - Math.sin(p0.h)), y: p0.y - R * (Math.cos(hh) - Math.cos(p0.h)), h: hh };
}
function endAt(p0, l, th) {
  if (Math.abs(th) < 1e-6) return { x: p0.x + Math.cos(p0.h) * l, y: p0.y + Math.sin(p0.h) * l };
  const R = l / th, hh = p0.h + th;
  return { x: p0.x + R * (Math.sin(hh) - Math.sin(p0.h)), y: p0.y - R * (Math.cos(hh) - Math.cos(p0.h)) };
}
const onBoard = (x, y) => x >= B / 2 && x <= W - B / 2 && y >= B / 2 && y <= BH - B / 2;
// the executed move: stops at the edge of the board if the path leaves it
function execPath(p0, m) {
  const N = 48; let last = 0;
  for (let i = 1; i <= N; i++) {
    const u = i / N, q = poseAt(p0, m, u);
    if (!onBoard(q.x, q.y)) {
      let a = last, b = u;
      for (let k = 0; k < 16; k++) { const mid = (a + b) / 2, r = poseAt(p0, m, mid); if (onBoard(r.x, r.y)) a = mid; else b = mid; }
      // stopped at the edge; the heading reflects off the void so the ship always faces back in (never stuck facing out)
      const e = poseAt(p0, m, a), o = poseAt(p0, m, b);
      let vx = Math.cos(e.h), vy = Math.sin(e.h);
      if (o.x < B / 2 || o.x > W - B / 2) vx = -vx;
      if (o.y < B / 2 || o.y > BH - B / 2) vy = -vy;
      return { uEnd: a, clipped: true, end: { x: e.x, y: e.y, h: Math.atan2(vy, vx) }, faced: e.h };
    }
    last = u;
  }
  const e = poseAt(p0, m, 1); if (m.shape === 'Flip') e.h = angN(e.h + Math.PI);
  return { uEnd: 1, clipped: false, end: e };
}
const ALL15 = [];
for (const sp of [1, 2, 3]) { ALL15.push(man('Straight', sp, 0)); for (const sd of [-1, 1]) { ALL15.push(man('Bank', sp, sd)); ALL15.push(man('Turn', sp, sd)); } }
function padEnd(m) { const e = poseAt({ x: 0, y: 0, h: UP }, m, 1, K); return { x: e.x, y: e.y }; }

// ---------------------------------------------------------------- stroke -> manoeuvre
function resample(pts, step) {
  const out = [{ x: pts[0].x, y: pts[0].y }]; let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    let a = pts[i - 1]; const b = pts[i]; let seg = Math.hypot(b.x - a.x, b.y - a.y);
    while (acc + seg >= step && seg > 0) {
      const t = (step - acc) / seg, p = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
      out.push(p); a = p; seg = Math.hypot(b.x - a.x, b.y - a.y); acc = 0;
    }
    acc += seg;
  }
  const L = pts[pts.length - 1], o = out[out.length - 1];
  if (Math.hypot(L.x - o.x, L.y - o.y) > 0.5) out.push({ x: L.x, y: L.y });
  return out;
}
function smooth5(p) {
  const n = p.length, o = new Array(n);
  for (let i = 0; i < n; i++) { let sx = 0, sy = 0, c = 0; for (let j = i - 2; j <= i + 2; j++) if (j >= 0 && j < n) { sx += p[j].x; sy += p[j].y; c++; } o[i] = { x: sx / c, y: sy / c }; }
  o[0] = p[0]; o[n - 1] = p[n - 1]; return o;
}
function analyse(raw) {
  if (!raw || raw.length < 2) return null;
  const a = raw[0], z = raw[raw.length - 1];
  let L = 0; for (let i = 1; i < raw.length; i++) L += Math.hypot(raw[i].x - raw[i - 1].x, raw[i].y - raw[i - 1].y);
  const sm = smooth5(resample(raw, 3)), s = resample(sm, 6);
  if (s.length < 2) return null;
  // initial heading from the first ~14 px; the bend counts from the nose (a stroke that starts sideways has already turned)
  let k = 1; const want = Math.min(14, L / 4);
  while (k < s.length - 1 && Math.hypot(s[k].x - s[0].x, s[k].y - s[0].y) < want) k++;
  const h0 = Math.atan2(s[k].y - s[0].y, s[k].x - s[0].x);
  let bend = angN(h0 - UP), prev = h0;
  for (let i = k + 1; i < s.length; i++) { const h = Math.atan2(s[i].y - s[i - 1].y, s[i].x - s[i - 1].x); bend += angN(h - prev); prev = h; }
  const dx = z.x - a.x, dy = z.y - a.y, disp = Math.hypot(dx, dy);
  let reach = 0; for (const p of sm) reach = Math.max(reach, Math.hypot(p.x - a.x, p.y - a.y));
  const ab = Math.abs(bend);
  const shape = (ab > 112.5 * DEG || dy > 6) ? 'Flip' : ab < 22.5 * DEG ? 'Straight' : ab < 67.5 * DEG ? 'Bank' : 'Turn';
  const side = bend > 0.02 ? 1 : bend < -0.02 ? -1 : (dx >= 0 ? 1 : -1);
  const tq = shape === 'Bank' ? Math.PI / 4 : shape === 'Turn' ? Math.PI / 2 : 0;
  const lest = shape === 'Flip' ? reach : disp * (tq ? tq / (2 * Math.sin(tq / 2)) : 1);   // the arc length the chord implies
  const speed = lest < T.thr1 ? 1 : lest < T.thr2 ? 2 : 3;
  return { m: man(shape, speed, side), bend: bend / DEG, disp, lest, L };
}
function tapPick(p) {
  if (p.y > 10) return man('Flip', 2, p.x >= 0 ? 1 : -1);      // behind the Craft: the Flip
  let best = null, bd = 1e9;
  for (const m of ALL15) { const e = padEnd(m), d = Math.hypot(e.x - p.x, e.y - p.y); if (d < bd) { bd = d; best = m; } }
  return best;
}

// ---------------------------------------------------------------- game state
let seed = 1, round = 0, phase = 'plan', sub = '', clock = 0, ANIM = true, timeScale = 1;
let craft, husk, planRaw = null, plan = null, hp = null, lastAnalysis = null;
let SK = null, shownStroke = null, tapMark = null, revealed = false;
let tgt = null, huskTgt = null, picked = false, tray = [], noTarget = false;
let tasks = [], toasts = [], fanT0 = 0, sightsT0 = 0, flash = 0, shake = { t0: -1e9, amp: 0 };
let stats = null, over = null, shotFired = false, readHit = null;
function newShip(kind, x, y, h) { return { kind, x, y, h, shields: 2, hull: 3, strain: 0, focus: false, clipped: false, fl: null }; }
const pose = s => ({ x: s.x, y: s.y, h: s.h });
function newStats() { return { strainTaken: 0, huskStrain: 0, bestShot: 0, arcDodges: 0, landed: 0, missed: 0, inHuskSights: 0, huskLanded: 0, huskShots: 0, killBurst: false, killHits: 0, clips: 0, focuses: 0, flips: 0, lastHuskDmg: 0,
  readRight: 0, reads: 0, huskFlips: 0, huskClips: 0, huskFocuses: 0, handTurns: 0, offTurns: 0, strainedHits: 0, behindIt: 0, learned: 0, desperate: 0, bold: 0, dmgTaken: 0, dmgDealt: 0 }; }

function after(ms, fn) { if (!ANIM) { fn(); return; } tasks.push({ at: clock + ms, fn }); }
function runTasks() {
  for (let guard = 0; guard < 64; guard++) {
    let idx = -1, at = 1e18;
    for (let i = 0; i < tasks.length; i++) if (tasks[i].at <= clock && tasks[i].at < at) { idx = i; at = tasks[i].at; }
    if (idx < 0) return;
    tasks.splice(idx, 1)[0].fn();
  }
}
function toast(text, col, ms) { toasts.push({ text, col: col || '#fff', t0: clock, ms: ms || 1600 }); if (toasts.length > 3) toasts.shift(); }

function restart(sd, opts) {
  opts = opts || {};
  if (opts.rival && RIVALS[opts.rival]) rivalKey = opts.rival;
  if (opts.level && LEVELS[opts.level]) level = opts.level;
  if (opts.fresh) habits = {};     // a rematch keeps what it learned about you; the test API starts fresh
  seed = sd | 0 || 1; rng = mulberry32(seed * 31 + 7); rv = newRival(seed);
  const r = mulberry32(seed * 7919 + 3);
  craft = newShip('craft', 200, 470, UP);
  husk = newShip('husk', 120 + r() * 160, 92 + r() * 20, Math.PI / 2 + (r() - 0.5) * 50 * DEG);
  round = 0; tasks = []; toasts = []; stats = newStats(); over = null; tray = []; buildBg();
  document.getElementById('end').classList.remove('on');
  document.getElementById('start').classList.remove('on');
  try { history.replaceState(null, '', location.pathname + '?seed=' + seed + '&rival=' + rivalKey + '&level=' + level); } catch (e) { /* file:// may refuse */ }
  try { localStorage.setItem('flight.rival', rivalKey); localStorage.setItem('flight.level', level); } catch (e) { /* storage off */ }
  startRound();
}
function startRound() {
  round++; phase = 'plan'; sub = '';
  craft.focus = false; husk.focus = false; craft.clipped = false; husk.clipped = false; craft.flown = husk.flown = false; shotFired = false;
  planRaw = plan = null; lastAnalysis = null; shownStroke = null; tapMark = null; SK = null; revealed = false;
  tray = []; tgt = huskTgt = null; picked = false; noTarget = false;
  hp = huskChoose(); fanT0 = clock;
}
// ---------------------------------------------------------------- the rival: your rules, your dice, an honest plan
// It plans at round start from what is on the board (both poses, Strain, health) and freezes the plan before the pad is
// touched. It never reads your stroke. It searches its legal moves against a weighted model of all of yours, scored in
// expected hull. Personalities are weight sets; each has one weakness you can learn to punish.
const RIVALS = {
  ram: { key: 'ram', name: 'Ram', line: 'Noses straight at you and jousts. Never looks back.',
    A: 1.0, D: 0.5, P: 0, R: 0.3, dStar: 90, K: 0.8, E: 1.2, N: 0.3, S: 0.15, lam: -0.1, T: 0.32, Dl: 0.7,
    bias: 'nose', biasW: 0.15, mix: { naive: 0.3 },
    tip: 'Let it rush past, then turn in behind it. It never checks its tail.' },
  kite: { key: 'kite', name: 'Kite', line: 'Holds Mid range and circles. Always the same way.',
    A: 0.88, D: 0.9, P: 0.6, R: 0.4, dStar: 200, K: 0.6, E: 1.6, N: 0.9, S: 0.4, lam: 0.25, T: 0.1, Dl: 0.3,
    bias: 'hand', biasW: 0.12, mix: {},
    tip: 'It circles one way. Turn the same way, inside its circle, and meet it nose-on.' },
  wisp: { key: 'wisp', name: 'Wisp', line: 'Slips out of your Sights. Flips when you get behind it.',
    A: 0.6, D: 1.4, P: 0.9, R: 0.2, dStar: 240, K: 0.5, E: 1.5, N: 0.6, S: 0.1, lam: 0.4, T: 0.11, Dl: 0.35,
    bias: 'flip', biasW: 0.35, mix: { habit: 0.15 },
    tip: 'A Flip strains it: next round it can only fly gently, with no Focus. Close in then.' },
};
const LEVELS = {
  easy: { name: 'Easy', naive: 1, reason: 0, tau: 0.45, habit: 0, tMul: 1.6, dMul: 1.4, lean: 0.85 },
  medium: { name: 'Medium', naive: 0.3, reason: 0.7, tau: 0.45, habit: 0.3, tMul: 1, dMul: 1, lean: 0.75 },
  hard: { name: 'Hard', naive: 0.15, reason: 0.6, tau: 0.4, habit: 0.45, tMul: 0.4, dMul: 0.5, lean: 0.65 },
};
let rivalKey = 'ram', level = 'medium', tune = {};
const RV = () => Object.assign({}, RIVALS[rivalKey], tune);
const MOVES18 = ALL15.concat([man('Flip', 1, 1), man('Flip', 2, 1), man('Flip', 3, 1)]);
const ESCAPES = [man('Straight', 1, 0), man('Turn', 1, -1), man('Turn', 1, 1)];
const NAIVE = { 'Straight 2 0': 0.75, 'Bank 2 -1': 0.125, 'Bank 2 1': 0.125 };
const mkey = m => m.shape + ' ' + m.speed + ' ' + (m.shape === 'Flip' ? 0 : m.side);
// exact damage odds for every Sights band and Focus pair (binomial convolution, built once)
function binom(n, p) { const o = []; for (let k = 0; k <= n; k++) { let c = 1; for (let i = 0; i < k; i++) c = c * (n - i) / (i + 1); o.push(c * Math.pow(p, k) * Math.pow(1 - p, n - k)); } return o; }
const EDT = [];
for (const nA of [3, 4]) for (const nD of [2, 3]) for (const aF of [0, 1]) for (const dF of [0, 1]) {
  const X = binom(nA, aF ? 6 / 8 : 4 / 8), Y = binom(nD, dF ? 5 / 8 : 3 / 8), P = new Array(nA + 1).fill(0);
  for (let x = 0; x <= nA; x++) for (let y = 0; y <= nD; y++) P[Math.max(0, x - y)] += X[x] * Y[y];
  let ed = 0; for (let k = 0; k <= nA; k++) ed += k * P[k];
  const ge = []; for (let r = 0; r <= 6; r++) { let s = 0; for (let k = r; k <= nA; k++) s += P[k]; ge.push(s); }
  EDT[(nA - 3) * 8 + (nD - 2) * 4 + aF * 2 + dF] = { ed, ge };
}
const edOf = (d, aF, dF) => EDT[(d <= 100 ? 8 : 0) + (d > 200 ? 4 : 0) + (aF ? 2 : 0) + (dF ? 1 : 0)];
function strainAfter(strain, m, clipped) { return clipped ? strain + (m.colour === 'red' ? 1 : 0) + 1 : m.colour === 'red' ? strain + 1 : m.colour === 'green' ? Math.max(0, strain - 1) : strain; }
// every point of an arc of length L lies within L/2 of one of its ends, so if both ends sit L/2 clear of the edge it cannot clip
const clear = (x, y, r) => x - r >= B / 2 && x + r <= W - B / 2 && y - r >= B / 2 && y + r <= BH - B / 2;
function execFast(p0, m) {
  const e = poseAt(p0, m, 1), r = lenOf(m.speed) / 2;
  if (!clear(p0.x, p0.y, r) || !clear(e.x, e.y, r)) return execPath(p0, m);
  if (m.shape === 'Flip') e.h = angN(e.h + Math.PI);
  return { uEnd: 1, clipped: false, end: e };
}

      planRaw: manOut(planRaw), huskPlan: manOut(hp), analysis: lastAnalysis && { bend: +lastAnalysis.bend.toFixed(1), lest: +lastAnalysis.lest.toFixed(1), disp: +lastAnalysis.disp.toFixed(1) },

        tray: tray.map(r => ({ who: r.who, att: r.att.map(d => d.f), def: r.def.map(d => d.f), rolledAtt: r.att.map(d => d.rolled), rolledDef: r.def.map(d => d.rolled), res: r.res, line: r.line, focusAtt: r.attF, focusDef: r.defF })),
        tasks: tasks.length, stats: { ...stats } },
    };
  },
  stroke(points, ms) { if (phase !== 'plan' || !points || !points.length) return null; strokeBegin(points[0], 0); for (let i = 1; i < points.length; i++) strokeMove(points[i]); strokeEnd(ms || 0); return manOut(plan); },
  fly, focus, pass, pick, roll, next,
  rollDice(kind, n) { const out = []; for (let i = 0; i < n; i++) out.push(face(kind)); return out; },
  seed(n, opts) { opts = Object.assign({}, opts); if (!opts.keepHabits) opts.fresh = true; restart(n, opts); return seed; },
  botTiming() { return { n: botMs.length, p50: pctl(botMs, 0.5), p95: pctl(botMs, 0.95), max: pctl(botMs, 1) }; },
  // run the decision n times on the current board without touching game state (same inputs, fresh decision rng each time)
  bench(n) { const t = []; let first = null, same = true; for (let i = 0; i < n; i++) { const pl = rivalPlan(decRng()); t.push(pl.ms); const k = pl.m.label + pl.m.side + '|' + pl.lean; if (first === null) first = k; else if (k !== first) same = false; } return { n, p50: pctl(t, 0.5), p95: pctl(t, 0.95), max: pctl(t, 1), deterministic: same, plan: first }; },
  perf() { const s = perfS.slice().sort((a, b) => a - b); return { frames: s.length, p50: s.length ? s[Math.floor(s.length * 0.5)] : 0, p95: s.length ? s[Math.floor(s.length * 0.95)] : 0, max: s.length ? s[s.length - 1] : 0 }; },
  resetPerf() { perfS.length = 0; },
  toScreen(wx, wy) { return { x: OX + wx * S, y: OY + wy * S }; },
  padToScreen(px, py) { return { x: OX + (PO.x + px) * S, y: OY + (PO.y + py) * S }; },
  padEnd(shape, speed, side) { return padEnd(man(shape, speed, side)); },
  anim(on) { ANIM = !!on; if (!ANIM) { while (tasks.length) { const t = tasks.shift(); t.fn(); } } return ANIM; },
  btn(id) { layoutButtons(); const b = BTNS.find(x => x.id === id); return b ? { x: OX + (b.x + b.w / 2) * S, y: OY + (b.y + b.h / 2) * S, on: b.on, h: b.h * S, w: b.w * S } : null; },
  get S() { return S; }, T, STRIKE, DODGE,
  dev: {
    place(who, x, y, h) { const s = who === 'husk' ? husk : craft; s.x = x; s.y = y; if (h != null) s.h = h; if (phase === 'plan' && who === 'craft') setPlan(planRaw); },
    setStrain(who, n) { const s = who === 'husk' ? husk : craft; s.strain = n; if (who === 'craft') setPlan(planRaw); },
    setHull(who, sh, hu) { const s = who === 'husk' ? husk : craft; s.shields = sh; s.hull = hu; },
    huskPlan(shape, speed, side) { hp = man(shape, speed, side); },
    rivalPlan: () => planOut(rv.plan), replan: () => planOut(rivalPlan(decRng())), hand: () => rv.hand, habits: () => JSON.parse(JSON.stringify(habits)),
    tune(o) { tune = Object.assign({}, o || {}); return RV(); }, level(l) { if (LEVELS[l]) level = l; return level; }, rivals: () => Object.keys(RIVALS),
    pause(on) { timeScale = on ? 0 : 1; },
    clock: () => clock,
  },
};

// ---------------------------------------------------------------- boot
const qs = new URLSearchParams(location.search);
seed = Math.max(1, parseInt(qs.get('seed') || '1', 10) || 1);
try { const r0 = localStorage.getItem('flight.rival'), l0 = localStorage.getItem('flight.level'); if (RIVALS[r0]) rivalKey = r0; if (LEVELS[l0]) level = l0; } catch (e) { /* storage off */ }
if (RIVALS[qs.get('rival')]) rivalKey = qs.get('rival');
if (LEVELS[qs.get('level')]) level = qs.get('level');
resize();
restart(seed);
if (!RIVALS[qs.get('rival')]) showStart(seed);     // a link that names its rival starts the duel at once
requestAnimationFrame(frame);
</script>
</body>
